<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I–XII 전투 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════
   I–XII · 전투 테스트판
   5×5 보드 보스전 — 코스트 루프 / 2코 기습 / 과부하 / 낮밤
   ═══════════════════════════════════════════════════════════ */
:root{
  color-scheme:dark;
  --ink:#0B0A0F;
  --panel:#15131B; --panel-2:#1C1924; --line:#2B2735; --line-2:#3C3649;
  --bone:#EDE6D9; --ash:#A39CAF; --mute:#6F6980;
  --brass:#D6AE62; --brass-hi:#F2D38F; --brass-lo:#7C6234;
  --danger:#FF4B37; --warn:#FFB84A; --aether:#5FE3D2; --volt:#B894FF; --blood:#C0203D; --ok:#8BDCA6;
  --k-melee:#EFA45E; --k-shot:#5FE3D2; --k-far:#86B8FF; --k-jam:#B894FF; --k-guard:#AFC6DA; --k-cool:#8BDCA6; --k-move:#F2E6C8;
  --vh:100vh;
  --gap:4px;
  --f-num:'Cinzel','Trajan Pro','Times New Roman',serif;
  --f-serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@supports (height:100dvh){:root{--vh:100dvh}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--ink);color:var(--bone);font:14px/1.45 var(--f-ui);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;margin:0}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* ── 앱 틀 · 낮/밤 분위기 ── */
#app{
  /* 오전(낮) — 감시망의 차가운 청회색 */
  --sky-a:#0B1219; --sky-b:#16232F; --tile-a:#1A2531; --tile-edge:#2A3B4A; --eye:#D9F1FF; --tick-on:var(--brass-hi);
  --reserve:450px;                     /* 보드 밖 UI가 차지하는 세로 높이 */
  --board:clamp(252px, min(calc(100vw - 32px), calc(var(--vh) - var(--reserve))), 520px);
  --cs:calc((var(--board) - 4 * var(--gap)) / 5);
  position:relative;flex:1 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px 12px;
  background:radial-gradient(120% 70% at 50% -5%, var(--sky-b) 0%, var(--sky-a) 55%, var(--ink) 100%);
  user-select:none;-webkit-user-select:none;overflow-x:clip;
}
#app[data-phase="night"]{
  /* 오후(밤) — 학살당한 광신의 핏빛 */
  --sky-a:#12070A; --sky-b:#260C13; --tile-a:#241317; --tile-edge:#43202A; --eye:#FF3B4E; --tick-on:#FF6A7E;
}
#app::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s ease;
  background:radial-gradient(38% 30% at 88% 4%, rgba(192,32,61,.34), transparent 70%), radial-gradient(90% 60% at 50% 110%, rgba(120,10,30,.28), transparent 70%)}
#app[data-phase="night"]::before{opacity:1}
#app.hurt-vig::after,#app.volt-vig::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;animation:vig .55s ease-out forwards}
#app.hurt-vig::after{box-shadow:inset 0 0 90px 20px rgba(255,40,40,.55)}
#app.volt-vig::after{box-shadow:inset 0 0 110px 30px rgba(184,148,255,.6)}
@keyframes vig{from{opacity:1}to{opacity:0}}
.col{width:max(var(--board), min(calc(100vw - 32px), 420px));max-width:100%;position:relative;z-index:1}
@media (hover:none){#app{--reserve:416px}}   /* 터치 기기는 단축키 안내가 없다 */
@media (max-height:700px){#app{gap:4px;padding-block:6px 8px}.foot{height:54px}.d-row.d-flav{display:none}.log p:first-child:not(:last-child){display:none}}

/* ── HUD ── */
.hud{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"clock name btns" "clock bars bars";column-gap:10px;row-gap:4px;align-items:center}
.clock-wrap{grid-area:clock;display:flex;flex-direction:column;align-items:center;gap:2px;width:66px}
.clock{width:58px;height:58px;filter:drop-shadow(0 3px 8px #000a)}
.ck-rim{fill:#17141D;stroke:var(--brass);stroke-width:2}
.ck-face{fill:#0E0C12}
.ck-tick{stroke:#3A3446;stroke-width:2.2;stroke-linecap:round;transition:stroke .25s}
.ck-tick.on{stroke:var(--tick-on)}
.ck-n{font:800 11px var(--f-num);fill:var(--ash);text-anchor:middle;dominant-baseline:central}
.ck-h{stroke:var(--brass);stroke-width:4;stroke-linecap:round}
.ck-m{stroke:var(--bone);stroke-width:1.8;stroke-linecap:round}
#ckHour,#ckMin{transform-origin:50px 50px;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.ck-c{fill:var(--brass-hi)}
.clock-meta{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums}
.clock-meta b{font:700 11px/1.2 var(--f-ui);white-space:nowrap}
.clock-meta span{font-size:10px;color:var(--ash);white-space:nowrap}
.boss-name{grid-area:name;min-width:0}
.bname{font:900 15px/1.2 var(--f-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font-size:11px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes blink{50%{opacity:.45}}
.boss-bars{grid-area:bars;display:flex;flex-direction:column;gap:3px;min-width:0}
.bar{position:relative;height:13px;border-radius:2px;background:#07060A;border:1px solid var(--line-2);overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v,1) * 100%);transition:width .35s ease}
.bar>b{position:absolute;inset:0;padding:0 6px;display:flex;justify-content:space-between;align-items:center;font:700 9.5px/1 var(--f-ui);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bar.hp>i{background:linear-gradient(90deg,#6F1420,#D8432F)}
.bar.bol{height:11px}
.bar.bol>i,.bar.pol>i{background:linear-gradient(90deg,#3E2F7A,var(--volt))}
.bar.bol::after,.bar.pol::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff33}
.hud-btns{grid-area:btns;display:flex;gap:4px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;padding:0;touch-action:manipulation}
.icon-btn svg{width:16px;height:16px;fill:var(--ash)}
.icon-btn:hover svg{fill:var(--brass-hi)}
.icon-btn.x{font:400 20px/1 var(--f-ui);color:var(--ash)}

/* ── 보스 의도 ── */
.intent{display:flex;align-items:center;gap:9px;padding:6px 9px;height:50px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(90deg,rgba(255,184,74,.08),transparent 55%),var(--panel)}
.intent.live{border-color:rgba(255,184,74,.55);background:linear-gradient(90deg,rgba(255,184,74,.18),transparent 70%),var(--panel)}
.mini{display:grid;grid-template-columns:repeat(5,6px);grid-auto-rows:6px;gap:1px;flex:none}
.mini i{background:#ffffff12;border-radius:1px}
.mini i.on{background:var(--warn)}
.mini i.me{box-shadow:inset 0 0 0 1.5px var(--brass-hi)}
.int-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.int-label{display:flex;align-items:center;gap:4px;font:700 10px/1 var(--f-ui);letter-spacing:.06em;color:var(--warn);white-space:nowrap;overflow:hidden}
.int-meta{display:flex;gap:4px;margin-left:4px;letter-spacing:0}
.int-main{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.int-chips{display:flex;gap:4px;min-width:0;overflow:hidden}
.int-label svg{width:11px;height:11px;fill:var(--warn)}
#intName{flex:none;font:900 13.5px/1.2 var(--f-serif)}
.chip{font:700 10px/1 var(--f-ui);padding:2px 5px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.c-warn{color:var(--warn)} .c-volt{color:var(--volt)} .c-ok{color:var(--ok)} .c-dim{color:var(--ash)}
.amb-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding-left:9px;border-left:1px solid var(--line);color:var(--danger);font:700 10px/1.1 var(--f-ui);white-space:nowrap}
.amb-chip svg{width:15px;height:15px;fill:var(--danger)}
.amb-chip b{font:800 13px/1 var(--f-num)}

/* ── 보드 ── */
.board{position:relative;z-index:1;flex:none;width:var(--board);height:var(--board);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:var(--gap)}
.cell{position:relative;border-radius:3px;background-color:var(--tile-a);border:1px solid var(--tile-edge);box-shadow:inset 0 -8px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);cursor:pointer;touch-action:manipulation;overflow:hidden;transition:background-color .8s,border-color .8s}
.cell::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .15s}
.cell::after{content:"";position:absolute;inset:3px;border:2px solid transparent;border-radius:3px;transition:border-color .12s,box-shadow .12s}
.cell .dist{position:absolute;left:4px;top:3px;font:600 9px/1 var(--f-num);color:rgba(255,255,255,.22);z-index:1}
.cell .pool{position:absolute;inset:14%;border-radius:46% 54% 50% 44%;background:radial-gradient(circle at 34% 30%,#E8526A 0,#9A1029 50%,#4A0712 100%);box-shadow:0 0 16px rgba(192,32,61,.55);opacity:0;transform:scale(.5);transition:opacity .45s,transform .45s}
.cell.blood{border-color:#6E1628}
.cell.blood .pool{opacity:.92;transform:scale(1);animation:pool 2.6s ease-in-out infinite}
@keyframes pool{50%{box-shadow:0 0 26px rgba(232,82,106,.7)}}
.cell.amb::before{opacity:1;background:repeating-linear-gradient(135deg,rgba(255,75,55,.58) 0 6px,rgba(255,75,55,.2) 6px 12px);background-size:17px 17px;box-shadow:inset 0 0 0 1px rgba(255,90,70,.95),inset 0 0 18px rgba(255,75,55,.5);animation:hatch 1s linear infinite}
@keyframes hatch{to{background-position:17px 0}}
.cell.atk::before{opacity:1;background:repeating-linear-gradient(45deg,rgba(255,184,74,.52) 0 5px,rgba(255,184,74,.15) 5px 10px);box-shadow:inset 0 0 0 1px rgba(255,200,110,.95),inset 0 0 18px rgba(255,184,74,.45)}
.board.amb-off .cell.amb::before,.board.atk-off .cell.atk::before{filter:grayscale(.9) brightness(.7);animation:none}
.board.arming .cell.amb::before{animation:armIn .5s ease-out,hatch 1s linear infinite}
@keyframes armIn{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}
.board.revealing .cell.atk::before{animation:armIn .4s ease-out}
.cell.mv::after{border:1px dashed rgba(255,255,255,.2)}
@media (hover:hover){.cell.mv:hover::after{border-color:var(--brass-hi);border-style:solid}}
.cell.rng::after{border-color:var(--aether);box-shadow:0 0 14px -2px var(--aether),inset 0 0 10px -4px var(--aether)}
.cell.leapd::after{border:2px dashed var(--bone);box-shadow:0 0 12px -4px var(--bone)}

/* 보스 줄 */
.boss-row{grid-row:1;grid-column:1/-1;position:relative;z-index:2}
.boss-art{position:absolute;inset:0;transition:filter .3s}
.boss-art svg,.boss-art img{width:100%;height:100%}
.boss-art img{object-fit:contain;object-position:center bottom}
.boss-svg .eye{fill:var(--eye);filter:drop-shadow(0 0 6px var(--eye));transition:fill .8s}
.boss-svg .lamp{fill:#FFB84A;animation:blink 1.4s steps(2) infinite}
.boss-svg .lamp:nth-child(2n){animation-delay:.7s}
.boss-svg .muz{fill:transparent}
.boss-svg .brl.fire .muz{fill:#FFF0C0;filter:drop-shadow(0 0 5px #FFB84A)}
.boss-svg .brl.fire{animation:recoil .28s ease-out}
@keyframes recoil{30%{transform:translateY(-4px)}}
.boss-row.hit .boss-art{animation:bossHit .32s ease-out}
@keyframes bossHit{0%{filter:brightness(2.6) saturate(0)}40%{transform:translateY(-3px)}100%{filter:none;transform:none}}
.boss-row.stunned .boss-art{filter:grayscale(.85) brightness(.72);animation:flick 1.3s steps(3) infinite}
@keyframes flick{40%{filter:grayscale(.9) brightness(.45)}}
.stun-tag{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:3px 8px;border-radius:2px;background:rgba(20,12,34,.88);border:1px solid var(--volt);color:var(--volt);font:700 11px/1.2 var(--f-ui);letter-spacing:.04em;white-space:nowrap;z-index:3;pointer-events:none}
.bcells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);pointer-events:none;z-index:2}
.bcell{position:relative;border-radius:4px;transition:box-shadow .12s}
.bcell.rng{box-shadow:inset 0 0 0 2px var(--aether),0 0 18px -3px var(--aether)}
.bcell.rng::after{content:"";position:absolute;left:50%;top:55%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--aether);border-radius:50%;box-shadow:0 0 8px var(--aether)}
.searchlight{position:absolute;left:50%;top:42%;width:62%;height:520%;translate:-50% 0;transform-origin:50% 0;pointer-events:none;z-index:4;opacity:.5;mix-blend-mode:screen;
  background:linear-gradient(180deg,rgba(200,230,255,.26),rgba(200,230,255,0) 88%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);animation:sweep 7s ease-in-out infinite alternate;transition:opacity .8s}
@keyframes sweep{from{rotate:-26deg}to{rotate:26deg}}
#app[data-phase="night"] .searchlight{opacity:0}

/* 기습 레이저 줄 */
.beams{position:absolute;inset:0;pointer-events:none;z-index:3}
.beam{position:absolute;background:#FF6A55;box-shadow:0 0 8px 1px rgba(255,75,55,.85);border-radius:2px;animation:beamPulse 1.1s ease-in-out infinite}
@keyframes beamPulse{50%{opacity:.55}}
.beam.h{left:calc(var(--x) * (var(--cs) + var(--gap)) + 8px);top:calc(var(--y) * (var(--cs) + var(--gap)) + var(--cs) / 2 - 1px);width:calc(var(--n) * var(--cs) + (var(--n) - 1) * var(--gap) - 16px);height:2px}
.beam.v{left:calc(var(--x) * (var(--cs) + var(--gap)) + var(--cs) / 2 - 1px);top:calc(var(--y) * (var(--cs) + var(--gap)) + 8px);height:calc(var(--n) * var(--cs) + (var(--n) - 1) * var(--gap) - 16px);width:2px}
.beam::before,.beam::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#FF6A55;box-shadow:0 0 6px #FF4B37}
.beam.h::before{left:-3px;top:-2.5px}.beam.h::after{right:-3px;top:-2.5px}
.beam.v::before{top:-3px;left:-2.5px}.beam.v::after{bottom:-3px;left:-2.5px}
.board.amb-off .beam{background:#777;box-shadow:none;animation:none;opacity:.5}
.board.amb-off .beam::before,.board.amb-off .beam::after{background:#777;box-shadow:none}

/* 주인공 */
.unit{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);z-index:5;pointer-events:none;
  transform:translate(calc(var(--c,2) * (var(--cs) + var(--gap))),calc(var(--r,4) * (var(--cs) + var(--gap))));transition:transform .15s cubic-bezier(.25,.8,.35,1)}
.hero-art{position:absolute;left:4%;right:4%;bottom:5%;height:128%;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.hero-art svg,.hero-art img{width:100%;height:100%}
.hero-art img{object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 4px rgba(0,0,0,.55))}
.unit.face-l .hero-art{transform:scaleX(-1)}
@keyframes bob{50%{translate:0 -3%}}
.hero-svg .halo{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{rotate:360deg}}
.hero-svg .eye{transform-box:fill-box;transform-origin:center;animation:eyeBlink 4.2s infinite}
@keyframes eyeBlink{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.unit.hop .hero-art{animation:hop .18s ease-out}
@keyframes hop{40%{translate:0 -12%;scale:.94 1.06}100%{translate:0 0}}
.unit.hit .hero-art{animation:hurt .42s ease-out}
@keyframes hurt{0%{filter:brightness(3) saturate(0)}25%{translate:-6% 0}50%{translate:5% 0;filter:brightness(1.4) sepia(1) hue-rotate(-40deg)}100%{translate:0 0;filter:none}}
.unit.frozen .hero-art{filter:saturate(.35) brightness(.9) drop-shadow(0 0 7px var(--volt));animation:jitter .14s steps(2) infinite}
@keyframes jitter{50%{translate:1.5% 0}}
.unit .ward{position:absolute;inset:-6%;border-radius:50%;border:2px solid rgba(175,198,218,.9);box-shadow:0 0 14px rgba(175,198,218,.55),inset 0 0 12px rgba(175,198,218,.35);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
.unit.warded .ward{opacity:1;transform:scale(1)}
.unit.blocked .ward{animation:wardHit .4s ease-out}
@keyframes wardHit{0%{transform:scale(1.25);border-color:#fff}100%{transform:scale(1)}}
.unit .sparks{position:absolute;inset:-10%;width:120%;height:120%;opacity:0;pointer-events:none}
.unit.frozen .sparks,.unit.fizz .sparks{opacity:1;animation:sparks .22s steps(2) infinite}
@keyframes sparks{50%{opacity:.25;rotate:12deg}}
.unit .frz-badge{position:absolute;right:-4px;top:-18%;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--volt);color:#1A1027;font:800 11px/18px var(--f-ui);text-align:center;opacity:0;transition:opacity .2s}
.unit.frozen .frz-badge{opacity:1}
.unit .bld-badge{position:absolute;left:-4px;top:-18%;height:18px;padding:0 5px;border-radius:9px;background:var(--blood);color:#FFE3E8;font:800 11px/18px var(--f-num);box-shadow:0 0 10px rgba(192,32,61,.8);opacity:0;transition:opacity .2s}
.unit.on-blood .bld-badge{opacity:1}

/* 이펙트 */
.fx{position:absolute;inset:0;pointer-events:none;z-index:7}
.fx-cell{position:absolute;left:calc(var(--c) * (var(--cs) + var(--gap)));top:calc(var(--r) * (var(--cs) + var(--gap)));width:var(--cs);height:var(--cs);border-radius:4px}
.fx-boom{background:radial-gradient(circle,#fff 0,#FFE0B8 18%,rgba(255,75,55,.9) 42%,rgba(255,75,55,0) 70%);animation:fxBoom .5s ease-out forwards}
.fx-boom.amber{background:radial-gradient(circle,#fff 0,#FFF1C9 18%,rgba(255,184,74,.92) 42%,rgba(255,184,74,0) 70%)}
.fx-zap{background:radial-gradient(circle,#E9FFFC 0,rgba(95,227,210,.85) 34%,rgba(95,227,210,0) 70%);animation:fxBoom .36s ease-out forwards}
.fx-zap.blood{background:radial-gradient(circle,#FFE3E8 0,rgba(232,52,82,.95) 34%,rgba(192,32,61,0) 72%)}
.fx-void{background:radial-gradient(circle,rgba(139,220,166,.55),transparent 70%);animation:fxBoom .5s ease-out forwards}
@keyframes fxBoom{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.45);opacity:0}}
.fx-num{position:absolute;translate:-50% -50%;font:800 22px/1 var(--f-num);color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000;white-space:nowrap;animation:fxRise .95s ease-out forwards}
.fx-num.hurt{color:#FF6352}
.fx-num.big{font-size:32px;color:#FF6A7E}
.fx-num.volt,.fx-num.block,.fx-num.ok{font:700 13px/1 var(--f-ui);padding:3px 7px;border-radius:2px;background:rgba(12,10,16,.85);text-shadow:none}
.fx-num.volt{color:var(--volt);border:1px solid var(--volt)}
.fx-num.block{color:var(--k-guard);border:1px solid var(--k-guard)}
.fx-num.ok{color:var(--ok);border:1px solid var(--ok)}
@keyframes fxRise{0%{opacity:0;transform:translateY(8px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.fx-nail{position:absolute;width:3px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(180deg,rgba(255,240,200,0),#FFE7B0 75%,#fff);transform-origin:top;animation:fxNail .26s ease-in forwards}
@keyframes fxNail{0%{transform:scaleY(0);opacity:1}70%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.board.shake-s{animation:shS .26s}
.board.shake-m{animation:shM .36s}
.board.shake-l{animation:shL .46s}
@keyframes shS{25%{translate:-3px 1px}50%{translate:2px -1px}75%{translate:-1px 2px}}
@keyframes shM{20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-4px 4px}80%{translate:2px -2px}}
@keyframes shL{15%{translate:-9px 5px}35%{translate:8px -7px}55%{translate:-7px 6px}75%{translate:4px -3px}}
.toast{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:9;max-width:92%;padding:8px 14px;border-radius:4px;background:rgba(28,20,32,.96);border:1px solid #7A2A22;color:#FFD3CB;font:600 13px/1.35 var(--f-ui);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;animation:toastIn .16s ease-out}
.toast.ok{border-color:#2F6B47;color:#CFF5DC}
@keyframes toastIn{from{opacity:0;scale:.92}}

/* ── 상태 줄 ── */
.status{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vitals{display:flex;align-items:center;gap:3px}
.heart{width:19px;height:19px;fill:#E04A3A;filter:drop-shadow(0 0 4px rgba(224,74,58,.45))}
.heart.empty{fill:#2A2430;filter:none}
.vitals.hurt{animation:shM .4s}
.shield{display:flex;align-items:center;gap:2px;margin-left:4px;color:var(--k-guard);font:700 12px/1 var(--f-ui)}
.shield svg{width:16px;height:16px;fill:var(--k-guard)}
.pips{display:flex;gap:4px}
.pip{position:relative;width:32px;height:24px;border-radius:3px;border:1px solid var(--brass-lo);background:linear-gradient(180deg,#3B301B,#1D1810);display:grid;place-items:center;transition:opacity .2s,border-color .2s}
.pip i{font:800 11px/1 var(--f-num);font-style:normal;color:var(--brass-hi)}
.pip svg{width:14px;height:14px}
.pip.m-amb svg{fill:var(--danger)}
.pip.m-atk svg{fill:var(--warn)}
.pip.spent{background:transparent;border-color:var(--line-2);opacity:.45}
.pip.next{box-shadow:0 0 0 1px var(--brass-hi),0 0 12px -2px var(--brass);animation:pipGlow 1.2s ease-in-out infinite}
@keyframes pipGlow{50%{box-shadow:0 0 0 1px var(--brass-hi),0 0 4px -2px var(--brass)}}
.pip.frz{border-color:var(--volt);background:linear-gradient(180deg,#2B2147,#161028)}
.pip.stn svg{opacity:.3}
.pip.stn::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;margin-top:-1px;background:var(--ok);rotate:-24deg;border-radius:1px}
.olw{display:flex;flex-direction:column;align-items:flex-end;gap:3px;justify-self:end;width:100%;max-width:110px}
.bar.pol{width:100%;height:9px}
.bar.pol.hot>i{background:linear-gradient(90deg,#6A3DC2,#FF7AD9)}
#olTxt{font:600 10.5px/1 var(--f-ui);color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}
#olTxt b{color:var(--bone)}
#olTxt .frz-t{color:var(--volt)}
.coach{height:18px;font:600 12px/18px var(--f-ui);color:var(--ash);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach.t-danger{color:#FF8272} .coach.t-warn{color:var(--warn)} .coach.t-ok{color:var(--ok)} .coach.t-volt{color:var(--volt)}

/* ── 손패 ── */
.hand-row{display:flex;align-items:flex-end;gap:6px;height:118px}
.hand{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center}
.card{--k:var(--brass);position:relative;flex:none;width:78px;height:106px;margin-left:var(--ov,5px);padding:5px 5px 4px;display:flex;flex-direction:column;gap:3px;border-radius:6px;border:1px solid #5A4A2C;
  background:linear-gradient(165deg,#251F2D 0%,#16121C 58%,#100D14 100%);box-shadow:0 8px 16px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07);text-align:left;cursor:pointer;touch-action:manipulation;transition:transform .14s ease,box-shadow .14s ease,filter .14s}
.card:first-child{margin-left:0}
.card::before{content:"";position:absolute;inset:2px;border:1px solid rgba(214,174,98,.16);border-radius:4px;pointer-events:none}
.has-card-art .card{background:var(--card-art) center/cover no-repeat,#16121C}
.has-card-art .card .c-name,.has-card-art .card .c-mid,.has-card-art .card .c-top{background:rgba(12,10,16,.72);border-radius:3px}
.k-melee{--k:var(--k-melee)} .k-shot{--k:var(--k-shot)} .k-far{--k:var(--k-far)} .k-jam{--k:var(--k-jam)} .k-guard{--k:var(--k-guard)} .k-cool{--k:var(--k-cool)} .k-move{--k:var(--k-move)}
.c-top{display:flex;align-items:center;gap:3px;height:15px}
.c-cost{flex:none;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font:800 9.5px/1 var(--f-num);color:#1A140A;background:radial-gradient(circle at 35% 30%,#FFE7AE,#C99A45 60%,#7C6234)}
.c-kind{flex:1;min-width:0;display:flex;align-items:center;gap:2px;font:700 9px/1 var(--f-ui);color:var(--k);letter-spacing:.03em;white-space:nowrap}
.c-kind svg{flex:none;width:10px;height:10px;fill:var(--k)}
.c-key{flex:none;font:600 9px/1 var(--f-ui);color:var(--mute);border:1px solid var(--line-2);border-radius:2px;padding:1px 3px}
.c-name{min-height:30px;display:flex;align-items:center;padding:0 1px;font:900 12px/1.2 var(--f-serif);word-break:keep-all}
.c-mid{flex:1;display:flex;align-items:center;gap:6px;padding:1px}
.c-mini{display:grid;grid-template-columns:repeat(3,5px);grid-auto-rows:5px;gap:1px;flex:none}
.c-mini i{background:rgba(255,255,255,.08);border-radius:1px}
.c-mini i.on{background:var(--k)}
.c-mini i.me{background:var(--brass-hi)}
.c-mini.icon{width:17px;height:29px;display:grid;place-items:center}
.c-mini.icon svg{width:16px;height:16px;fill:var(--k)}
.c-stat{display:flex;flex-direction:column;line-height:1;min-width:0}
.c-stat b{font:800 19px/1 var(--f-num);font-variant-numeric:tabular-nums}
.c-stat small{margin-top:2px;font-size:9px;color:var(--ash);white-space:nowrap}
.c-tags{display:flex;flex-wrap:nowrap;gap:2px;min-height:13px;overflow:hidden}
.c-tags em{flex:none;display:flex;align-items:center;gap:1px;padding:2px 3px;border-radius:2px;background:rgba(255,255,255,.07);font:700 8px/1 var(--f-ui);font-style:normal;color:var(--ash);white-space:nowrap}
.c-tags em svg{width:8px;height:8px;fill:currentColor}
.t-ol{color:var(--volt)!important} .t-bol{color:var(--ok)!important} .t-rap{color:#FF9D82!important} .t-per{color:var(--brass-hi)!important}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 2px var(--aether),0 14px 24px -10px #000;z-index:4}
@media (hover:hover){.card:hover{transform:translateY(-8px);z-index:4}}
.card.off{filter:grayscale(.75) brightness(.6)}
.card.bld{border-color:var(--blood);box-shadow:0 0 14px -3px var(--blood)}
.card.bld .c-stat b{color:#FF7A8C}
.card.frz{border-color:var(--volt)}
.c-flag{position:absolute;left:4px;right:4px;bottom:4px;padding:2px 0;border-radius:2px;text-align:center;font:700 9px/1.3 var(--f-ui)}
.c-flag.off{color:#FFB9AD;background:#2A0E0E;border:1px solid #7A2A22}
.c-flag.frz{color:#E3D6FF;background:#1E1434;border:1px solid var(--volt)}
.draw-btn{flex:none;width:54px;height:106px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;border-radius:6px;border:1px dashed #6A5733;
  background:repeating-linear-gradient(135deg,#1B1720 0 6px,#15121A 6px 12px);cursor:pointer;touch-action:manipulation}
.draw-btn svg{width:20px;height:20px;fill:var(--brass)}
.draw-btn b{font:700 12px/1 var(--f-ui)}
.draw-btn small{font-size:9.5px;line-height:1.25;color:var(--ash);text-align:center}
.draw-btn .c-cost{margin-bottom:1px}
.draw-btn.dis{opacity:.4;cursor:not-allowed}
@media (hover:hover){.draw-btn:not(.dis):hover{border-color:var(--brass);border-style:solid}}

/* ── 하단: 카드 상세 / 전투 기록 ── */
.foot{height:74px;overflow:hidden}
.detail{height:100%;padding:6px 10px;border:1px solid var(--brass-lo);border-radius:5px;background:rgba(21,19,27,.97);display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:11.5px;line-height:1.35}
.d-row{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.d-range,.d-text,.d-eff{overflow:hidden;text-overflow:ellipsis;min-width:0}
.d-eff{flex:1}
.d-kind{display:flex;align-items:center;gap:3px;font:700 10px/1 var(--f-ui);color:var(--k)}
.d-kind svg{width:11px;height:11px;fill:var(--k)}
.d-name{font:900 13.5px/1.2 var(--f-serif)}
.d-range{color:var(--ash)}
.d-text{color:var(--ash)}
.d-eff b{font-variant-numeric:tabular-nums}
.d-eff .v{color:var(--volt)} .d-eff .g{color:var(--ok)} .d-eff .bl{font-style:normal;color:#FF8FA0}
.st{flex:none;font:700 10.5px/1 var(--f-ui);padding:3px 6px;border-radius:2px;white-space:nowrap}
.st.good{color:var(--ok);background:rgba(139,220,166,.12)}
.st.bad{color:#FF9C8E;background:rgba(255,75,55,.12)}
.st.frz{color:var(--volt);background:rgba(184,148,255,.14)}
.btn-use{flex:none;padding:4px 10px;border-radius:4px;border:1px solid var(--brass);background:linear-gradient(180deg,#3E3219,#241C0E);color:var(--brass-hi);font:700 12px/1 var(--f-ui);cursor:pointer}
.hint{flex:none;color:var(--mute);font-size:10.5px}
.log{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;font-size:11.5px;line-height:1.45;color:var(--mute)}
.log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log p:last-child{color:var(--ash)}
.log .l-bad{color:#FF8A7A} .log .l-ok{color:var(--ok)} .log .l-volt{color:var(--volt)} .log .l-blood{color:#FF8FA0} .log .l-day{color:#BFE4FF} .log .l-warn{color:var(--warn)}
.log p:not(:last-child){opacity:.6}
.keys{font-size:11px;color:var(--mute);text-align:center}
.keys kbd{font:600 10px/1 var(--f-ui);padding:2px 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;color:var(--ash)}
@media (hover:none){.keys{display:none}}

/* ── 오버레이 ── */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;overflow-y:auto;background:radial-gradient(80% 60% at 50% 38%,rgba(11,10,16,.84),rgba(5,4,8,.96))}
.ov-panel{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{display:flex;align-items:center;gap:14px;font:800 56px/1 var(--f-num);color:var(--brass);letter-spacing:.04em;text-shadow:0 0 30px rgba(214,174,98,.35)}
.logo i{display:block;width:34px;height:2px;background:var(--brass)}
.logo-sub{margin:0;font:700 14px/1.4 var(--f-serif);color:var(--ash);letter-spacing:.08em}
.rules{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%}
.rules li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:rgba(21,19,27,.8);font-size:12.5px;line-height:1.45;color:var(--ash)}
.rules li b{display:block;color:var(--bone);font-size:13px;margin-bottom:1px}
.rules svg{flex:none;width:18px;height:18px;margin-top:1px;fill:var(--brass)}
.rules .r-amb svg{fill:var(--danger)} .rules .r-atk svg{fill:var(--warn)} .rules .r-volt svg{fill:var(--volt)} .rules .r-blood svg{fill:#FF6A7E}
.ctrl{margin:0;font-size:12px;color:var(--mute)}
.btn-main{min-width:180px;padding:12px 28px;border-radius:4px;border:1px solid var(--brass);background:linear-gradient(180deg,#4A3B1E,#2A2111);color:var(--brass-hi);font:900 16px/1 var(--f-serif);letter-spacing:.12em;cursor:pointer;box-shadow:0 0 24px -6px rgba(214,174,98,.5)}
.btn-main:hover{background:linear-gradient(180deg,#5A4824,#33281A)}
.btn-sub{padding:10px 18px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel);color:var(--ash);font:700 13px/1 var(--f-ui);cursor:pointer}
.res-kicker{margin:0;font:700 11px/1 var(--f-ui);letter-spacing:.2em;color:var(--mute)}
.res-title{margin:0;font:900 44px/1.1 var(--f-serif);text-wrap:balance}
.res-title.win{color:var(--brass-hi)} .res-title.lose{color:#FF6A5A}
.res-sub{margin:0;color:var(--ash);font-size:13px}
.res-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin:4px 0}
.res-stats div{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:left}
.res-stats dt{font-size:10.5px;color:var(--mute)}
.res-stats dd{margin:2px 0 0;font:800 17px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.res-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.banner{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;padding:16px}
.banner-in{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 34px;border-radius:6px;text-align:center;animation:bannerIn 1.5s ease forwards}
.banner-in.day{background:linear-gradient(180deg,rgba(18,32,44,.95),rgba(10,16,24,.95));border:1px solid #6E8FAA;box-shadow:0 0 60px rgba(191,228,255,.25)}
.banner-in.night{background:linear-gradient(180deg,rgba(44,10,20,.95),rgba(20,6,10,.95));border:1px solid var(--blood);box-shadow:0 0 60px rgba(192,32,61,.4)}
.banner-in svg{width:34px;height:34px}
.banner-in.day svg{fill:#FFE39A} .banner-in.night svg{fill:#FF6A7E}
.banner-in small{font:800 13px/1 var(--f-num);letter-spacing:.2em;color:var(--ash)}
.banner-in b{font:900 30px/1.15 var(--f-serif)}
.banner-in span{font-size:12.5px;color:var(--ash);line-height:1.5}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.12)}14%{opacity:1;transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(.97)}}

/* ── 시트(규칙 · 테스트 설정) ── */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,4,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-panel{width:min(480px,100%);max-height:88%;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line-2);border-radius:10px 10px 0 0;background:var(--panel);user-select:text;-webkit-user-select:text}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:8px}}
.sheet-head{position:sticky;top:-14px;z-index:1;display:flex;align-items:center;justify-content:space-between;margin:-14px -16px 8px;padding:12px 16px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font:900 17px/1.2 var(--f-serif)}
.sheet section{margin:12px 0}
.sheet h4{margin:0 0 6px;font:700 12px/1.3 var(--f-ui);letter-spacing:.06em;color:var(--brass)}
.sheet p,.sheet li{font-size:12.5px;line-height:1.55;color:var(--ash)}
.sheet p{margin:0 0 6px}
.sheet ol,.sheet ul{margin:0;padding-left:20px}
.sheet b{color:var(--bone)}
.sheet code{font:500 11.5px/1 ui-monospace,Menlo,Consolas,monospace;padding:1px 4px;border-radius:2px;background:#0B0A0F;color:var(--brass-hi)}
.sheet .ok{color:var(--ok)} .sheet .dim{color:var(--mute)}
.tbl-wrap{overflow-x:auto}
.ctbl{width:100%;border-collapse:collapse;font-size:11.5px}
.ctbl th,.ctbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;color:var(--ash)}
.ctbl th{font-weight:700;color:var(--mute);white-space:nowrap}
.ctbl td:first-child{color:var(--bone);font-weight:700;white-space:nowrap}
.cfg-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-bottom:8px}
.cfg-actions button{padding:8px 6px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);font:700 12px/1.2 var(--f-ui);color:var(--bone);cursor:pointer}
.cfg-actions button:hover{border-color:var(--brass)}
.cfg-actions .danger{color:#FF9C8E}
.cfg-note{margin:0 0 4px!important;font-size:11.5px!important;color:var(--mute)!important}
.cfg-g{margin:14px 0 4px!important}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--bone);cursor:default}
.cfg-row>span:first-child{flex:1;min-width:0}
.cfg-row em{font-style:normal;font-size:10px;color:var(--mute);margin-left:4px}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:28px;height:28px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);font:700 15px/1 var(--f-ui);cursor:pointer;padding:0}
.step output{min-width:44px;text-align:center;font:700 13px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.seg button{padding:6px 8px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);font:600 11.5px/1.2 var(--f-ui);color:var(--ash);cursor:pointer}
.seg button.on{border-color:var(--brass);color:var(--brass-hi);background:#2A2111}
.sw-row input{position:absolute;opacity:0;width:1px;height:1px}
.sw{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:#2A2632;border:1px solid var(--line-2);transition:background .15s;cursor:pointer}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--ash);transition:transform .15s,background .15s}
.sw-row input:checked+.sw{background:#3B2F16;border-color:var(--brass)}
.sw-row input:checked+.sw::after{transform:translateX(18px);background:var(--brass-hi)}
.sw-row input:focus-visible+.sw{outline:2px solid var(--brass-hi);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app" data-phase="day">

  <!-- ═════ HUD: 시계 · 보스 ═════ -->
  <header class="hud col">
    <div class="clock-wrap">
      <svg id="clock" class="clock" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="clock-meta"><b id="clockTime">오전 12:00</b><span id="clockNext">전환까지 30코</span></div>
    </div>
    <div class="boss-name">
      <div class="bname" id="bossName">집행 병기 「못박이」</div>
      <div class="bsub">인류 정부군 · 테스트 보스</div>
    </div>
    <div class="hud-btns">
      <button class="icon-btn" id="btnHelp" type="button" aria-label="규칙과 조작"><svg><use href="#i-help"/></svg></button>
      <button class="icon-btn" id="btnCfg" type="button" aria-label="테스트 설정"><svg><use href="#i-gear"/></svg></button>
      <button class="icon-btn" id="btnSnd" type="button" aria-label="소리 끄기"><svg><use href="#i-snd"/></svg></button>
    </div>
    <div class="boss-bars">
      <div class="bar hp" id="bossHp"><i></i><b></b></div>
      <div class="bar bol" id="bossOl"><i></i><b></b></div>
    </div>
  </header>

  <!-- ═════ 보스 의도: 턴 공격 예고 · 기습 칸 수 ═════ -->
  <div class="intent col" id="intent">
    <div class="mini" id="intMini" aria-hidden="true"></div>
    <div class="int-txt">
      <span class="int-label"><svg><use href="#i-hazard"/></svg>턴 공격 예고<span class="int-meta" id="intMeta"></span></span>
      <span class="int-main"><b id="intName">—</b><span class="int-chips" id="intChips"></span></span>
    </div>
    <div class="amb-chip" id="ambChip"></div>
  </div>

  <!-- ═════ 5×5 보드 ═════ -->
  <main class="board" id="board">

<script>
(() => {
'use strict';

/* ═════════════════════════════════════════════

const $ = s => document.querySelector(s);
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const sleep = ms => new Promise(r => setTimeout(r, RM.matches ? ms * 0.35 : ms));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function readJSON(k) { try { return JSON.parse(localStorage.getItem(k) || 'null') || {}; } catch (e) { return {}; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장이 막힌 환경은 무시 */ } }

/* ═════════════════════════════════════════════
   1. 설정 — 테스트 패널(⚙)에서 조정, 브라우저에 저장

const SND_KEY = 'i12.battle-test.sound.v1';
const CFG = sanitizeCfg(Object.assign({}, DEFAULTS, readJSON(CFG_KEY)));
function sanitizeCfg(c) {
  for (const [k, [lo, hi]] of Object.entries(LIMITS)) {
    const v = Number(c[k]);
