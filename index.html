/* ═════════════════════════════════════════════
   2. 보드 좌표 — 0행은 보스, 1~4행이 플레이어 구역
   ═════════════════════════════════════════════ */
const COLS = 5;
const AMBUSH_AT = 2;                                   // 루프의 2번째 코스트를 지불하는 순간 기습 폭발
const K = (r, c) => r * COLS + c;
const RC = k => [Math.floor(k / COLS), k % COLS];
const inCol = c => c >= 0 && c < COLS;
const inArea = (r, c) => r >= 1 && r <= 4 && inCol(c);
const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
const dirOf = (dr, dc) => dr < 0 ? 'up' : dr > 0 ? 'down' : dc < 0 ? 'left' : 'right';
const AREA = [];
for (let r = 1; r <= 4; r++) for (let c = 0; c < COLS; c++) AREA.push(K(r, c));
const colCells = c => [1, 2, 3, 4].map(r => K(r, c));
const rowCells = r => [0, 1, 2, 3, 4].map(c => K(r, c));

/* ═════════════════════════════════════════════
   3. 데이터 — 사거리 · 카드 · 보스 패턴
   ═════════════════════════════════════════════ */
// 사거리: 플레이어 기준 [행 변화, 열 변화]. 음수 행 = 보스 쪽(앞)
const SHAPES = {
  fan3:   { label: '앞 3칸 부채꼴', cells: [[-1, -1], [-1, 0], [-1, 1]] },
  line2:  { label: '직선 2칸',      cells: [[-1, 0], [-2, 0]] },
  pierce: { label: '직선 관통',     cells: [[-1, 0], [-2, 0], [-3, 0], [-4, 0]] },
  far:    { label: '3~4칸 앞',      cells: [[-3, 0], [-4, 0]] },
  halo5:  { label: '앞·양옆 5칸',   cells: [[-1, -1], [-1, 0], [-1, 1], [0, -1], [0, 1]] },
};
const reachRows = shape => [1, 2, 3, 4].filter(r => SHAPES[shape].cells.some(([dr]) => r + dr === 0));
function reachText(shape) {
  const rows = reachRows(shape);
  if (rows.length === 4) return '어디서나 명중';
  if (rows.length === 1) return `거리 ${rows[0]}에서만 명중`;
  return `거리 ${rows[0]}~${rows[rows.length - 1]}에서 명중`;
}
const hitColumns = (shape, p) => SHAPES[shape].cells.filter(([dr, dc]) => p.r + dr === 0 && inCol(p.c + dc)).map(([, dc]) => p.c + dc);

const KINDS = {
  melee: { label: '근접',   icon: 'i-blade' },
  shot:  { label: '사격',   icon: 'i-shot' },
  far:   { label: '원거리', icon: 'i-mortar' },
  jam:   { label: '교란',   icon: 'i-bolt' },
  guard: { label: '방어',   icon: 'i-shield' },
  cool:  { label: '정비',   icon: 'i-drop' },
  move:  { label: '기동',   icon: 'i-leap' },
};
// 테스트용 카드 — 모든 카드는 1코스트. n = 덱에 들어가는 장수
const CARDS = {
  gear_cleave: { name: '톱니 베기',      kind: 'melee', shape: 'fan3',   dmg: 7,  n: 3, text: '앞 3칸 부채꼴을 톱니 날로 벤다.' },
  holy_pierce: { name: '성광 관통',      kind: 'shot',  shape: 'pierce', dmg: 4,  n: 2, text: '전방 직선을 끝까지 꿰뚫는다.' },
  aimed_shell: { name: '정조준 포격',    kind: 'far',   shape: 'far',    dmg: 10, n: 1, text: '3~4칸 앞에 포탄을 떨어뜨린다. 뒤에 있어야 닿는다.' },
  rivet_burst: { name: '리벳 연사',      kind: 'shot',  shape: 'line2',  dmg: 3,  n: 1, ol: 10, rapid: 10, persist: true, text: '써도 손에 남는다. 연달아 쓸 때마다 과부하가 10씩 더 붙는다.' },
  backflow:    { name: '역류 주입',      kind: 'jam',   shape: 'line2',  dmg: 3,  n: 2, bossOl: 40, text: '보스 회로에 역류 전류를 흘려 과부하시킨다.' },
  prayer_ward: { name: '기도 방벽',      kind: 'guard', shield: 1,       n: 2, text: '다음 피격 1회를 막는다. 최대 2겹.' },
  coolant:     { name: '냉각 성수',      kind: 'cool',  cool: 40,        n: 1, text: '달아오른 회로를 식혀 과부하를 낮춘다.' },
  steam_leap:  { name: '증기 도약',      kind: 'move',  leap: 2,         n: 2, text: '방향을 골라 최대 2칸 도약한다.' },
  descent:     { name: '기계 신의 강림', kind: 'melee', shape: 'halo5',  dmg: 18, n: 1, ol: 40, bossOl: 20, text: '앞과 양옆을 불태운다. 몸이 버티지 못한다.' },
};

// 보스 턴 공격 패턴 — 루프 시작 때 예고, 기습 폭발 순간 범위 공개, 코스트 소진 순간 발동
const PATTERNS = [
  { id: 'aim',     name: '장력 못총 · 조준', dmg: 2, nail: true, aimed: true, desc: '내가 선 세로줄을 관통 사격',
    make: p => colCells(p.c) },
  { id: 'volley',  name: '못총 일제사격',    dmg: 1, nail: true, aimed: true, desc: '내 세로줄과 멀리 떨어진 세로줄 하나',
    roll: () => ({ u: Math.random() }),
    make: (p, q) => { const far = [0, 1, 2, 3, 4].filter(c => Math.abs(c - p.c) >= 2); return [...colCells(p.c), ...colCells(far[Math.floor(q.u * far.length)])]; } },
  { id: 'front',   name: '정면 제압',        dmg: 2, desc: '보스 바로 앞 두 줄 (거리 1~2)',
    make: () => [...rowCells(1), ...rowCells(2)] },
  { id: 'rear',    name: '후방 포격',        dmg: 1, desc: '뒤쪽 두 줄 (거리 3~4)',
    make: () => [...rowCells(3), ...rowCells(4)] },
  { id: 'checker', name: '바둑판 폭격',      dmg: 1, aimed: true, desc: '내 칸을 포함한 엇갈린 칸',
    make: p => AREA.filter(k => { const [r, c] = RC(k); return (r + c) % 2 === (p.r + p.c) % 2; }) },
  { id: 'ring',    name: '포위 사격',        dmg: 1, nail: true, desc: '가장자리 한 바퀴',
    make: () => AREA.filter(k => { const [r, c] = RC(k); return r === 1 || r === 4 || c === 0 || c === 4; }) },
  { id: 'cross',   name: '십자 조준',        dmg: 2, aimed: true, desc: '내 가로줄과 세로줄',
    make: p => [...rowCells(p.r), ...colCells(p.c)] },
];

/* ═════════════════════════════════════════════
   4. 기습 폭격 생성 — 가로·세로 줄 조각을 합쳐 정확히 n칸
   ═════════════════════════════════════════════ */
function canEscape(set, p) {
  return Object.values(DIRS).some(([dr, dc]) => inArea(p.r + dr, p.c + dc) && !set.has(K(p.r + dr, p.c + dc)));
}
function genAmbush(n, day, p, prevKey) {
  const me = K(p.r, p.c);
  for (let t = 0; t < 2000; t++) {
    const set = new Set(), segs = [];
    let over = false;
    for (let i = 0; set.size < n && i < 7; i++) {
      const horiz = Math.random() < 0.5;
      const full = horiz ? COLS : 4;
      // 낮: 감시망 — 대부분 판 끝까지 이어진 줄 / 밤: 2~3칸 짧은 줄
      const len = day ? (Math.random() < 0.7 ? full : ri(3, full)) : ri(2, Math.min(3, full));
      const through = i === 0 && Math.random() < 0.8;   // 첫 줄은 대개 플레이어를 노린다
      let idx, start;
      if (horiz) {
        idx = through ? p.r : ri(1, 4);
        start = through ? ri(Math.max(0, p.c - len + 1), Math.min(p.c, COLS - len)) : ri(0, COLS - len);
      } else {
        idx = through ? p.c : ri(0, COLS - 1);
        start = through ? ri(Math.max(1, p.r - len + 1), Math.min(p.r, 5 - len)) : ri(1, 5 - len);
      }
      const cells = [];
      for (let j = 0; j < len; j++) cells.push(horiz ? K(idx, start + j) : K(start + j, idx));
      const added = cells.filter(k => !set.has(k)).length;
      if (!added) continue;
      if (set.size + added > n) { over = true; break; }
      cells.forEach(k => set.add(k));
      segs.push({ horiz, idx, start, len });
    }
    if (over || set.size !== n) continue;
    const key = [...set].sort((a, b) => a - b).join('.');
    if (key === prevKey) continue;
    const onMe = set.has(me);
    if (onMe && !canEscape(set, p)) continue;              // 첫 이동 한 번으로 피할 수 있어야 한다
    if (!onMe && Math.random() < 0.8) continue;           // 대부분은 내 칸을 덮는다
    return { cells: set, segs, key };
  }
  // 예비안: 내 가로줄 + 두 칸 떨어진 줄 조각 (항상 위/아래로 탈출 가능)
  const set = new Set(), segs = [];
  const r2 = p.r <= 2 ? p.r + 2 : p.r - 2;
  segs.push({ horiz: true, idx: p.r, start: 0, len: COLS });
  rowCells(p.r).forEach(k => set.add(k));
  const len2 = clamp(n - COLS, 0, COLS);
  if (len2) { segs.push({ horiz: true, idx: r2, start: 0, len: len2 }); for (let c = 0; c < len2; c++) set.add(K(r2, c)); }
  return { cells: set, segs, key: [...set].sort((a, b) => a - b).join('.') };
}

/* ═════════════════════════════════════════════
   5. 상태
   ═════════════════════════════════════════════ */
const S = { tok: 0 };
class Abort extends Error {}
// 재시작하면 진행 중이던 연출·판정 흐름을 끊는다
async function wait(ms) { const t = S.tok; await sleep(ms); if (t !== S.tok) throw new Abort(); }

function newBattle() {
  S.tok++;
  Object.assign(S, {
    loop: 0, loopCost: CFG.costPerLoop, costLeft: 0, spent: 0,
    total: 0, totalP: 0, totalB: 0, lastSwitch: 0, phaseIdx: 0,
    phase: CFG.startPhase,
    hp: CFG.playerHp, maxHp: CFG.playerHp, shield: 0, ol: 0, freeze: 0,
    boss: { hp: CFG.bossHp, max: CFG.bossHp, ol: 0, stun: 0 },
    p: { r: 4, c: 2 }, faceL: false,
    deck: [], hand: [], discard: [], uid: 0,
    amb: null, ambFired: false, prevAmbKey: '',
    intent: null, atk: null, prevPat: '',
    blood: new Set(),
    lastAct: '', chain: 0,
    sel: null, hover: null,
    busy: false, over: false, started: false,
    stats: { dealt: 0, taken: 0, bloodHits: 0, freezes: 0, stuns: 0, dodged: 0, cards: 0 },
    logs: [],
  });
  for (const [id, def] of Object.entries(CARDS)) for (let i = 0; i < def.n; i++) S.deck.push({ uid: ++S.uid, id });
  shuffle(S.deck);
  if (S.phase === 'night') rollBlood();
  $('#banner').hidden = true;
  $('#result').hidden = true;
}

/* ═════════════════════════════════════════════
   6. 엔진 — 루프 · 행동 · 발동
   ═════════════════════════════════════════════ */
async function run(fn) {
  if (S.busy || S.over) return;
  const t = S.tok;
  S.busy = true; render();
  try { await fn(); }
  catch (e) { if (!(e instanceof Abort)) console.error(e); }
  if (t === S.tok) { S.busy = false; render(); }
}

function addCost(who, n) {
  if (n <= 0) return;
  S.total += n;
  if (who === 'p') S.totalP += n; else S.totalB += n;
}

function drawOne() {
  if (!S.deck.length) {
    if (!S.discard.length) return false;
    S.deck = shuffle(S.discard); S.discard = [];
    log('버린 카드를 섞어 덱을 채웠다', 'dim');
  }
  S.hand.push(S.deck.pop());
  return true;
}
function drawUpTo(n) { while (S.hand.length < Math.min(n, CFG.handMax)) if (!drawOne()) break; }
function rollBlood() { S.blood = new Set(shuffle(AREA.slice()).slice(0, CFG.bloodTiles)); }
function pickPattern() { return pick(PATTERNS.filter(p => p.id !== S.prevPat)); }

async function startLoop() {
  S.loop++;
  S.loopCost = CFG.costPerLoop; S.costLeft = S.loopCost; S.spent = 0;
  S.atk = null; S.ambFired = false;
  drawUpTo(CFG.handRefill);
  if (S.phase === 'night') rollBlood();
  const day = S.phase === 'day';
  S.amb = genAmbush(day ? CFG.ambushDay : CFG.ambushNight, day, S.p, S.prevAmbKey);
  S.prevAmbKey = S.amb.key;
  const pat = pickPattern();
  S.prevPat = pat.id;
  S.intent = { pat, q: pat.roll ? pat.roll() : {} };
  log(`루프 ${S.loop} — 기습 ${S.amb.cells.size}칸 예고 · 턴 공격 「${pat.name}」`, 'dim');
  SFX.arm(); render(); FX.flash($('#board'), 'arming', 520);
  await wait(220);
}

function validate(a) {
  if (a.type === 'move') {
    const [dr, dc] = DIRS[a.dir];
    const r = S.p.r + dr, c = S.p.c + dc;
    if (r < 1 && inCol(c)) return '보스가 버틴 줄로는 들어갈 수 없어요';
    if (!inArea(r, c)) return '보드 끝이에요';
    return null;
  }
  if (a.type === 'draw') {
    if (S.hand.length >= CFG.handMax) return `손패가 가득 찼어요 (최대 ${CFG.handMax}장)`;
    if (!S.deck.length && !S.discard.length) return '더 뽑을 카드가 없어요';
    return null;
  }
  if (a.type === 'card') {
    const inst = S.hand[a.i];
    if (!inst) return '카드가 없어요';
    const def = CARDS[inst.id];
    if (def.shape && !hitColumns(def.shape, S.p).length) return `사거리 밖 — ${reachText(def.shape)}`;
    if (def.leap) {
      if (!a.dir) return '도약할 방향을 고르세요 — WASD 또는 점선 칸';
      const [dr, dc] = DIRS[a.dir];
      if (!inArea(S.p.r + dr, S.p.c + dc)) return '그 방향으로는 도약할 수 없어요';
    }
    return null;
  }
  return '알 수 없는 행동';
}

function act(a) {
  if (!S.started || S.busy || S.over) return;
  if (S.freeze <= 0) {
    const err = validate(a);
    if (err) { toast(err); SFX.deny(); return; }
  }
  run(() => doAct(a));
}

async function doAct(a) {
  const frozen = S.freeze > 0;          // 이번 지불이 마비 구간인가
  const bossDown = S.boss.stun > 0;     // 이번 지불이 보스 정지 구간인가
  S.sel = null; S.hover = null;
  // ① 코스트 지불
  S.costLeft--; S.spent++;
  if (frozen) S.freeze--;
  if (bossDown) S.boss.stun--;
  addCost('p', 1);
  const last = S.costLeft <= 0;
  render();
  // ② 지불 순간 발동 — 2번째 코스트: 기습 폭발 → 턴 공격 범위 공개
  if (S.spent === AMBUSH_AT && !S.ambFired) {
    await fireAmbush(bossDown);
    if (S.over) return;
    revealAttack();
    await wait(160);
  }
  if (last && CFG.atkTiming === 'pay') { await fireAttack(bossDown); if (S.over) return; }
  // ③ 행동 처리 (마비 중이면 코스트만 날아간다)
  if (frozen) await fizzle(a); else await resolve(a);
  if (S.over) return;
  if (last && CFG.atkTiming === 'after') { await fireAttack(bossDown); if (S.over) return; }
  // ④ 낮밤 전환 → ⑤ 루프 종료
  await checkPhase();
  if (last) { await endLoop(); await startLoop(); }
}

async function fireAmbush(bossDown) {
  S.ambFired = true;
  const amb = S.amb;
  if (!amb) return;
  if (bossDown) {
    log('기습 폭격 무력화 — 보스 과부하 정지 중', 'ok');
    await FX.cancel(amb.cells);
    S.amb = null; render();
    return;
  }
  addCost('b', CFG.bossAmbushCost);
  const hit = amb.cells.has(K(S.p.r, S.p.c));
  await FX.ambushBlast(amb);
  S.amb = null; render();
  if (hit) await damagePlayer(CFG.ambushDmg, { src: '기습 폭격' });
  else { S.stats.dodged++; log('기습 폭격 — 회피', 'ok'); }
}

function revealAttack() {
  if (!S.intent || S.atk) return;
  S.atk = new Set(S.intent.pat.make(S.p, S.intent.q));
  SFX.warn(); render(); FX.flash($('#board'), 'revealing', 420);
}

async function fireAttack(bossDown) {
  if (!S.atk) revealAttack();
  const pat = S.intent.pat;
  if (bossDown) {
    log(`턴 공격 「${pat.name}」 무력화 — 보스 과부하 정지 중`, 'ok');
    await FX.cancel(S.atk);
    S.atk = null; render();
    return;
  }
  addCost('b', CFG.bossAttackCost);
  const cells = S.atk;
  const hit = cells.has(K(S.p.r, S.p.c));
  await FX.attackBlast(cells, pat);
  S.atk = null; render();
  if (hit) await damagePlayer(pat.dmg, { src: `턴 공격 「${pat.name}」`, nail: pat.nail });
  else { S.stats.dodged++; log(`턴 공격 「${pat.name}」 — 회피`, 'ok'); }
}

async function damagePlayer(dmg, o) {
  if (S.shield > 0) {
    S.shield--;
    log(`${o.src} — 기도 방벽으로 막음`, 'ok');
    render(); await FX.block();
    return;
  }
  const real = CFG.god ? 0 : dmg;
  S.hp = Math.max(0, S.hp - real);
  S.stats.taken += dmg;
  log(CFG.god ? `${o.src} 명중 (무적 모드)` : `${o.src} 명중 — HP −${dmg}`, 'bad');
  render(); await FX.playerHit(real);
  if (S.hp <= 0) { await defeat(); return; }
  if (o.nail) addOverload(CFG.nailOl, '장력 가속 못총');
  render();
}

function addOverload(n, src) {
  if (n <= 0) return;
  S.ol = Math.min(CFG.olMax, S.ol + n);
  log(`${src} — 과부하 +${n}`, 'volt');
  if (S.ol >= CFG.olMax) {
    S.ol = CFG.olReset;
    S.freeze = Math.max(S.freeze, CFG.freezeCost);
    S.stats.freezes++;
    S.lastAct = ''; S.chain = 0;
    log(`과부하 ${CFG.olMax}! 시스템 정지 — ${CFG.freezeCost}코스트 동안 마비`, 'volt');
    FX.freeze();
  }
}
function addBossOl(n) {
  if (n <= 0) return;
  S.boss.ol = Math.min(CFG.olMax, S.boss.ol + n);
  if (S.boss.ol >= CFG.olMax) {
    S.boss.ol = CFG.olReset;
    S.boss.stun = Math.max(S.boss.stun, CFG.bossStunCost);
    S.stats.stuns++;
    log(`보스 과부하! ${CFG.bossStunCost}코스트 동안 기습·턴 공격 정지`, 'ok');
    FX.stun();
  }
}

async function fizzle(a) {
  S.lastAct = 'fizzle'; S.chain = 0;
  log(a.type === 'move' ? '마비 — 제자리에서 움직이지 못했다' : a.type === 'draw' ? '마비 — 뽑기 실패, 코스트만 소모' : '마비 — 카드가 작동하지 않았다', 'volt');
  SFX.fizzle(); FX.fizzle();
  render();
  await wait(240);
}

async function resolve(a) {
  if (a.type === 'move') { await doMove(a.dir, 1); S.lastAct = 'move'; S.chain = 0; return; }
  if (a.type === 'draw') {
    drawOne(); S.lastAct = 'draw'; S.chain = 0;
    log('카드 1장 추가 뽑기'); SFX.draw(); render();
    await wait(150);
    return;
  }
  if (a.type === 'card') await playCard(a);
}

async function doMove(dir, dist) {
  const [dr, dc] = DIRS[dir];
  let r = S.p.r, c = S.p.c;
  for (let i = 0; i < dist && inArea(r + dr, c + dc); i++) { r += dr; c += dc; }
  if (dc) S.faceL = dc < 0;
  S.p = { r, c };
  SFX.step(); FX.flash($('#player'), 'hop', 200);
  render();
  await wait(dist > 1 ? 210 : 150);
}

function nextOl(def, id) {
  return (def.ol || 0) + (def.rapid ? def.rapid * (S.lastAct === id ? S.chain + 1 : 0) : 0);
}

async function playCard(a) {
  const inst = S.hand[a.i];
  const def = CARDS[inst.id];
  const chain = S.lastAct === inst.id ? S.chain + 1 : 0;      // 직전까지 같은 카드를 연달아 쓴 횟수
  S.stats.cards++;
  if (!def.persist) { S.hand.splice(a.i, 1); S.discard.push(inst); }
  render();
  if (def.leap) { log(`${def.name} — 도약`); await doMove(a.dir, a.dist || def.leap); }
  if (def.shape) {
    const onBlood = S.blood.has(K(S.p.r, S.p.c));
    const mult = onBlood ? CFG.bloodMult : 1;
    const dmg = def.dmg * mult;
    const cols = hitColumns(def.shape, S.p);
    await FX.cardStrike(def, onBlood);
    S.boss.hp = Math.max(0, S.boss.hp - dmg);
    S.stats.dealt += dmg;
    if (onBlood) S.stats.bloodHits++;
    FX.bossHit(cols, dmg, onBlood); SFX.hit(onBlood);
    log(onBlood ? `${def.name} — 핏빛 ×${mult}! 보스에 ${dmg} 피해` : `${def.name} — 보스에 ${dmg} 피해`, onBlood ? 'blood' : '');
    render();
    if (S.boss.hp <= 0) { await victory(); return; }
    if (def.bossOl) addBossOl(def.bossOl);
    const ol = (def.ol || 0) + (def.rapid ? def.rapid * chain : 0) + (onBlood ? CFG.bloodOl : 0);
    if (ol) addOverload(ol, onBlood ? '핏빛 타일 반동' : def.rapid && chain ? `${def.name} ${chain + 1}연사` : def.name);
    render();
    await wait(230);
  }
  if (def.shield) {
    S.shield = Math.min(2, S.shield + def.shield);
    log(`${def.name} — 실드 ${S.shield}겹`, 'ok');
    SFX.ward(); FX.flash($('#player'), 'blocked', 420); render();
    await wait(220);
  }
  if (def.cool) {
    const before = S.ol;
    S.ol = Math.max(0, S.ol - def.cool);
    log(`${def.name} — 과부하 ${before} → ${S.ol}`, 'ok');
    SFX.cool(); render();
    await wait(200);
  }
  S.lastAct = inst.id; S.chain = chain;
}

async function checkPhase() {
  while (S.total - S.lastSwitch >= CFG.phaseCost) { S.lastSwitch += CFG.phaseCost; await switchPhase(); }
}
async function switchPhase() {
  S.phase = S.phase === 'day' ? 'night' : 'day';
  S.phaseIdx++;
  if (S.phase === 'night') rollBlood(); else S.blood = new Set();
  log(S.phase === 'night' ? '오후 12:00 — 광신의 시간. 핏빛 타일이 깔렸다' : '오전 12:00 — 감시망 가동. 기습이 판 끝까지 뻗는다', S.phase === 'night' ? 'blood' : 'day');
  SFX.chime(); render();
  await FX.phaseBanner(S.phase);
}

async function endLoop() { S.amb = null; S.atk = null; render(); await wait(200); }

async function victory() {
  S.over = true; S.sel = null; S.hover = null;
  SFX.win(); render();
  await FX.bossDown();
  showResult(true);
}
async function defeat() {
  S.over = true; S.sel = null; S.hover = null;
  SFX.lose(); render();
  await FX.playerDown();
  showResult(false);
}

/* ═════════════════════════════════════════════
   7. 이미지 슬롯 — assets/ 폴더에 넣으면 자동 교체
   ═════════════════════════════════════════════ */
const ASSET_SLOTS = { hero: 'assets/hero', cardBg: 'assets/card-bg', boss: 'assets/boss' };
const ASSET = { hero: null, cardBg: null, boss: null };
function probe(base) {
  const exts = ['png', 'webp', 'jpg', 'jpeg', 'gif'];
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= exts.length) return res(null);
      const url = `${base}.${exts[i++]}`;
      const img = new Image();
      img.onload = () => res(url);
      img.onerror = next;
      img.src = url;
    };
    next();
  });
}
async function loadAssets() {
  const [hero, cardBg, boss] = await Promise.all([probe(ASSET_SLOTS.hero), probe(ASSET_SLOTS.cardBg), probe(ASSET_SLOTS.boss)]);
  Object.assign(ASSET, { hero, cardBg, boss });
  if (hero) $('#heroArt').innerHTML = `<img src="${hero}" alt="" draggable="false">`;
  if (cardBg) { document.documentElement.style.setProperty('--card-art', `url("${cardBg}")`); $('#app').classList.add('has-card-art'); }
  if (boss) $('#bossArt').innerHTML = `<img src="${boss}" alt="" draggable="false">`;
}

/* ═════════════════════════════════════════════
   8. 렌더링
   ═════════════════════════════════════════════ */
const CELLS = {}, BCELLS = [];
let TICKS = [];
let handSig = '', beamSig = '';

function buildBoard() {
  const board = $('#board'), beams = $('#beams');
  for (const k of AREA) {
    const [r, c] = RC(k);
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.gridRow = r + 1; el.style.gridColumn = c + 1;
    el.innerHTML = `<i class="pool"></i>${c === 0 ? `<span class="dist">${r}</span>` : ''}`;
    el.addEventListener('click', () => onCell(r, c));
    board.insertBefore(el, beams);
    CELLS[k] = el;
  }
  const bc = $('#bcells');
  for (let c = 0; c < COLS; c++) { const d = document.createElement('div'); d.className = 'bcell'; bc.appendChild(d); BCELLS.push(d); }
}

function buildClock() {
  const n = CFG.phaseCost;
  let h = '<circle cx="50" cy="50" r="48" class="ck-rim"/><circle cx="50" cy="50" r="44" class="ck-face"/>';
  for (let i = 0; i < n; i++) {
    const a = (i + 0.5) / n * Math.PI * 2;
    const x1 = 50 + 39 * Math.sin(a), y1 = 50 - 39 * Math.cos(a), x2 = 50 + 44 * Math.sin(a), y2 = 50 - 44 * Math.cos(a);
    h += `<line class="ck-tick" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
  }
  [['XII', 0], ['III', 90], ['VI', 180], ['IX', 270]].forEach(([t, deg]) => {
    const a = deg * Math.PI / 180;
    h += `<text class="ck-n" x="${(50 + 28 * Math.sin(a)).toFixed(2)}" y="${(50 - 28 * Math.cos(a)).toFixed(2)}">${t}</text>`;
  });
  h += '<g id="ckHour"><line class="ck-h" x1="50" y1="50" x2="50" y2="27"/></g><g id="ckMin"><line class="ck-m" x1="50" y1="54" x2="50" y2="15"/></g><circle class="ck-c" cx="50" cy="50" r="3.6"/>';
  $('#clock').innerHTML = h;
  TICKS = [...document.querySelectorAll('#clock .ck-tick')];
}

function clockState() {
  const into = S.total - S.lastSwitch;
  const frac = clamp(into / CFG.phaseCost, 0, 1);
  const mins = Math.round(frac * 720);
  const hh = Math.floor(mins / 60) % 12 || 12, mm = mins % 60;
  return { frac, into, label: `${S.phase === 'day' ? '오전' : '오후'} ${hh}:${String(mm).padStart(2, '0')}`, left: Math.max(0, CFG.phaseCost - into) };
}

const ambCancelled = () => !!(S.amb && !S.ambFired && AMBUSH_AT - S.spent >= 1 && AMBUSH_AT - S.spent <= S.boss.stun);
const atkCancelled = () => !!(S.intent && S.loopCost - S.spent >= 1 && S.loopCost - S.spent <= S.boss.stun);

function render() {
  renderHud(); renderIntent(); renderBoard(); renderStatus(); renderHand(); renderFoot();
}

function setBar(el, v, html) { el.style.setProperty('--v', clamp(v, 0, 1)); if (html !== undefined) el.querySelector('b').innerHTML = html; }

function renderHud() {
  const ck = clockState();
  const turns = S.phaseIdx + ck.frac;                   // 계속 앞으로만 도는 누적 회전
  $('#ckHour').style.transform = `rotate(${turns * 360}deg)`;
  $('#ckMin').style.transform = `rotate(${turns * 12 * 360}deg)`;
  const on = Math.min(TICKS.length, ck.into);
  TICKS.forEach((t, i) => t.classList.toggle('on', i < on));
  $('#clockTime').textContent = ck.label;
  $('#clockNext').textContent = `전환까지 ${ck.left}코`;
  $('#app').dataset.phase = S.phase;
  setBar($('#bossHp'), S.boss.hp / S.boss.max, `<span>HP</span><span>${S.boss.hp} / ${S.boss.max}</span>`);
  setBar($('#bossOl'), S.boss.ol / CFG.olMax, `<span>과부하</span><span>${S.boss.ol} / ${CFG.olMax}</span>`);
  const tag = $('#stunTag');
  tag.hidden = !(S.boss.stun > 0);
  tag.textContent = `과부하 정지 · ${S.boss.stun}코`;
  const snd = $('#btnSnd');
  snd.querySelector('use').setAttribute('href', SFX.muted ? '#i-mute' : '#i-snd');
  snd.setAttribute('aria-label', SFX.muted ? '소리 켜기' : '소리 끄기');
}

function miniGrid(cells) {
  let h = '';
  for (const k of AREA) h += `<i class="${cells.has(k) ? 'on' : ''}${k === K(S.p.r, S.p.c) ? ' me' : ''}"></i>`;
  return h;
}

function renderIntent() {
  const n = S.amb ? S.amb.cells.size : (S.phase === 'day' ? CFG.ambushDay : CFG.ambushNight);
  $('#ambChip').innerHTML = `<svg><use href="#i-cross"/></svg><span>기습 <b>${n}</b>칸</span><span>${S.phase === 'day' ? '오전' : '오후'}</span>`;
  const it = S.intent;
  if (!it) { $('#intName').textContent = '교전 대기'; $('#intMeta').innerHTML = ''; $('#intChips').innerHTML = ''; $('#intMini').innerHTML = miniGrid(new Set()); $('#intent').classList.remove('live'); return; }
  const pat = it.pat;
  const cells = S.atk || new Set(pat.make(S.p, it.q));
  $('#intName').textContent = `「${pat.name}」`;
  $('#intMeta').innerHTML = `<span class="chip c-warn">피해 ${pat.dmg}</span>${pat.nail ? `<span class="chip c-volt">못총 과부하 +${CFG.nailOl}</span>` : ''}`;
  $('#intChips').innerHTML = atkCancelled() ? '<span class="chip c-ok">무력화 예정</span>'
    : S.atk ? '<span class="chip c-warn">범위 공개</span>'
    : pat.aimed ? '<span class="chip c-dim" title="기습이 터지는 순간 내 위치를 기준으로 범위가 정해진다">조준형</span>' : '';
  $('#intMini').innerHTML = miniGrid(cells);
  $('#intent').classList.toggle('live', !!S.atk);
}

function preview() {
  const i = S.sel !== null ? S.sel : S.hover;
  const out = { cells: new Set(), bcols: new Set(), leap: new Map() };
  if (i === null || !S.hand[i] || !S.started || S.over) return out;
  const def = CARDS[S.hand[i].id];
  if (def.shape) for (const [dr, dc] of SHAPES[def.shape].cells) {
    const r = S.p.r + dr, c = S.p.c + dc;
    if (!inCol(c)) continue;
    if (r === 0) out.bcols.add(c); else if (inArea(r, c)) out.cells.add(K(r, c));
  }
  if (def.leap) for (const [dir, [dr, dc]] of Object.entries(DIRS)) {
    for (let d = 1; d <= def.leap; d++) {
      const r = S.p.r + dr * d, c = S.p.c + dc * d;
      if (!inArea(r, c)) break;
      out.leap.set(K(r, c), { dir, dist: d });
    }
  }
  return out;
}

function renderBoard() {
  const pv = preview();
  const showMv = S.started && !S.over && S.sel === null && S.hover === null;
  for (const k of AREA) {
    const [r, c] = RC(k);
    const el = CELLS[k];
    el.classList.toggle('amb', !!(S.amb && S.amb.cells.has(k)));
    el.classList.toggle('atk', !!(S.atk && S.atk.has(k)));
    el.classList.toggle('blood', S.blood.has(k));
    el.classList.toggle('rng', pv.cells.has(k));
    el.classList.toggle('leapd', pv.leap.has(k));
    el.classList.toggle('mv', showMv && Math.abs(r - S.p.r) + Math.abs(c - S.p.c) === 1);
  }
  BCELLS.forEach((b, c) => b.classList.toggle('rng', pv.bcols.has(c)));
  const board = $('#board');
  board.classList.toggle('amb-off', ambCancelled());
  board.classList.toggle('atk-off', !!S.atk && atkCancelled());
  renderBeams();
  const pl = $('#player');
  pl.style.setProperty('--r', S.p.r); pl.style.setProperty('--c', S.p.c);
  pl.classList.toggle('face-l', S.faceL);
  pl.classList.toggle('frozen', S.freeze > 0);
  pl.classList.toggle('warded', S.shield > 0);
  $('#frzBadge').textContent = S.freeze > 0 ? S.freeze : '';
  pl.classList.toggle('on-blood', S.started && S.blood.has(K(S.p.r, S.p.c)));
  $('#bldBadge').textContent = `×${CFG.bloodMult}`;
  $('#bossRow').classList.toggle('stunned', S.boss.stun > 0);
}

function renderBeams() {
  const sig = S.amb ? S.amb.key : '';
  if (sig === beamSig) return;
  beamSig = sig;
  $('#beams').innerHTML = S.amb ? S.amb.segs.map(s => s.horiz
    ? `<i class="beam h" style="--x:${s.start};--y:${s.idx};--n:${s.len}"></i>`
    : `<i class="beam v" style="--x:${s.idx};--y:${s.start};--n:${s.len}"></i>`).join('') : '';
}

function pipTitle(j, n) {
  if (j === AMBUSH_AT) return `${j}번째 코스트: 지불하는 순간 기습 폭발`;
  if (j === n) return `${j}번째 코스트: 턴 공격`;
  return `${j}번째 코스트`;
}
function renderStatus() {
  let h = '';
  for (let i = 0; i < S.maxHp; i++) h += `<svg class="heart${i < S.hp ? '' : ' empty'}"><use href="#i-heart"/></svg>`;
  $('#hearts').innerHTML = h;
  $('#shield').innerHTML = S.shield > 0 ? `<svg><use href="#i-shield"/></svg>${S.shield}` : '';
  // 코스트 칸
  const n = S.loopCost;
  let p = '';
  for (let j = 1; j <= n; j++) {
    const spent = j <= S.spent, ahead = j - S.spent;
    const cls = ['pip'];
    let icon = '';
    if (j === AMBUSH_AT) { cls.push('m-amb'); icon = 'i-cross'; }
    if (j === n) { cls.push('m-atk'); icon = 'i-hazard'; }
    if (spent) cls.push('spent');
    else {
      if (ahead === 1 && S.started && !S.over) cls.push('next');
      if (ahead <= S.freeze) cls.push('frz');
      if (icon && ahead <= S.boss.stun) cls.push('stn');
    }
    p += `<span class="${cls.join(' ')}" title="${pipTitle(j, n)}">${icon ? `<svg><use href="#${icon}"/></svg>` : `<i>${j}</i>`}</span>`;
  }
  $('#pips').innerHTML = p;
  const ob = $('#olBar');
  ob.style.setProperty('--v', S.ol / CFG.olMax);
  ob.classList.toggle('hot', S.ol >= 70);
  $('#olTxt').innerHTML = S.freeze > 0 ? `<b class="frz-t">시스템 정지 ${S.freeze}코</b>` : `과부하 <b>${S.ol}</b> / ${CFG.olMax}`;
  const co = coach();
  const ce = $('#coach');
  ce.textContent = co.t;
  ce.title = co.t;
  ce.className = 'coach col' + (co.tone ? ' t-' + co.tone : '');
}

function coach() {
  if (!S.started || S.over) return { t: '', tone: '' };
  const me = K(S.p.r, S.p.c);
  if (S.freeze > 0) return { t: `시스템 정지 — 눌러도 코스트만 빠진다 (남은 ${S.freeze}코)`, tone: 'volt' };
  const next = S.spent + 1;
  if (S.amb && !S.ambFired) {
    const inRed = S.amb.cells.has(me);
    if (next === AMBUSH_AT) {
      if (ambCancelled()) return { t: '기습 차례 — 보스 정지로 무력화', tone: 'ok' };
      return inRed ? { t: '다음 행동 순간 기습 폭발 — 빨간 줄 위!', tone: 'danger' } : { t: '다음 행동 순간 기습 폭발 — 여기는 안전', tone: 'ok' };
    }
    return inRed ? { t: '빨간 줄 위 — 첫 행동으로 대피하세요', tone: 'danger' } : { t: '안전 지대 — 기습은 2번째 코스트에 폭발', tone: 'ok' };
  }
  if (S.atk) {
    const inAtk = S.atk.has(me);
    if (S.costLeft === 1) {
      if (atkCancelled()) return { t: '턴 공격 차례 — 보스 정지로 무력화', tone: 'ok' };
      if (CFG.atkTiming === 'pay') return inAtk ? { t: '다음 행동 순간 턴 공격 — 주황 범위 안!', tone: 'warn' } : { t: '다음 행동 순간 턴 공격 — 여기는 안전', tone: 'ok' };
      return { t: '마지막 행동 뒤 턴 공격 — 주황 밖에서 끝내기', tone: inAtk ? 'warn' : 'ok' };
    }
    return inAtk ? { t: '주황 범위 안 — 턴 공격 전에 벗어나세요', tone: 'warn' } : { t: '주황 범위 밖 — 공격할 타이밍', tone: 'ok' };
  }
  return { t: '', tone: '' };
}

function cardStat(def, onBlood) {
  if (def.shape) { const mult = onBlood ? CFG.bloodMult : 1; return `<b>${def.dmg * mult}</b><small>${onBlood ? `핏빛 ×${mult}` : '피해'}</small>`; }
  if (def.shield) return `<b>+${def.shield}</b><small>실드</small>`;
  if (def.cool) return `<b>−${def.cool}</b><small>과부하</small>`;
  if (def.leap) return `<b>${def.leap}</b><small>칸 도약</small>`;
  return '';
}
function cardTags(def, inst) {
  const t = [];
  const ol = nextOl(def, inst.id);
  if (def.rapid) t.push('<em class="t-rap">연사</em>');
  if (def.persist) t.push('<em class="t-per">상주</em>');
  if (ol) t.push(`<em class="t-ol"><svg><use href="#i-bolt"/></svg>${ol}</em>`);
  if (def.bossOl) t.push(`<em class="t-bol">보스+${def.bossOl}</em>`);
  return t.join('');
}
function miniRange(def) {
  if (!def.shape) return `<span class="c-mini icon"><svg><use href="#${KINDS[def.kind].icon}"/></svg></span>`;
  const on = new Set(SHAPES[def.shape].cells.map(([dr, dc]) => `${dr},${dc}`));
  let h = '';
  for (let dr = -4; dr <= 0; dr++) for (let dc = -1; dc <= 1; dc++) h += `<i class="${dr === 0 && dc === 0 ? 'me' : on.has(`${dr},${dc}`) ? 'on' : ''}"></i>`;
  return `<span class="c-mini">${h}</span>`;
}

function renderHand() {
  const frozen = S.freeze > 0;
  const onBlood = S.blood.has(K(S.p.r, S.p.c));
  const sig = [S.hand.map(h => h.uid).join(','), S.p.r, S.p.c, frozen, onBlood, S.sel, S.over, S.started, S.lastAct, S.chain, CFG.bloodMult, CFG.bloodOl].join('|');
  if (sig !== handSig) {
    handSig = sig;
    $('#hand').innerHTML = S.hand.map((inst, i) => {
      const def = CARDS[inst.id];
      const kind = KINDS[def.kind];
      const reach = def.shape ? hitColumns(def.shape, S.p).length > 0 : true;
      const cls = ['card', 'k-' + def.kind];
      if (S.sel === i) cls.push('sel');
      if (frozen) cls.push('frz');
      else if (!reach) cls.push('off');
      if (!frozen && onBlood && def.shape && reach) cls.push('bld');
      const flag = frozen ? '<span class="c-flag frz">마비</span>' : !reach ? '<span class="c-flag off">사거리 밖</span>' : '';
      return `<button class="${cls.join(' ')}" type="button" tabindex="-1" data-i="${i}" aria-label="${def.name} · ${kind.label}">
        <span class="c-top"><span class="c-cost">1</span><span class="c-kind"><svg><use href="#${kind.icon}"/></svg>${kind.label}</span><span class="c-key">${i + 1}</span></span>
        <span class="c-name">${def.name}</span>
        <span class="c-mid">${miniRange(def)}<span class="c-stat">${cardStat(def, onBlood && reach)}</span></span>
        <span class="c-tags">${cardTags(def, inst)}</span>${flag}</button>`;
    }).join('');
    fitHand();
  }
  // 뽑기 버튼
  const db = $('#drawBtn');
  const canDraw = S.hand.length < CFG.handMax && (S.deck.length + S.discard.length) > 0;
  db.classList.toggle('dis', S.freeze <= 0 && !canDraw);
  db.innerHTML = `<span class="c-cost">1</span><svg><use href="#i-deck"/></svg><b>뽑기</b><small>덱 ${S.deck.length}<br>버림 ${S.discard.length}</small>`;
  db.setAttribute('aria-label', `카드 1장 추가 뽑기, 1코스트. 덱 ${S.deck.length}장`);
}

function fitHand() {
  const hand = $('#hand');
  const n = S.hand.length;
  if (!n) return;
  const w = 78, avail = hand.clientWidth;
  const natural = n * w + (n - 1) * 5;
  hand.style.setProperty('--ov', (natural <= avail || n < 2 ? 5 : Math.floor((avail - n * w) / (n - 1))) + 'px');
}

function renderFoot() {
  const i = S.sel !== null ? S.sel : S.hover;
  const det = $('#detail'), lg = $('#log');
  if (i === null || !S.hand[i] || S.over || !S.started) {
    det.hidden = true; lg.hidden = false;
    lg.innerHTML = S.logs.slice(-3).map(l => `<p class="${l.cls ? 'l-' + l.cls : ''}">${l.t}</p>`).join('');
    return;
  }
  det.innerHTML = detailHTML(i);
  det.hidden = false; lg.hidden = true;
}

function detailHTML(i) {
  const inst = S.hand[i], def = CARDS[inst.id], kind = KINDS[def.kind];
  const frozen = S.freeze > 0;
  const onBlood = S.blood.has(K(S.p.r, S.p.c));
  let range = '자신', state = '<span class="st good">사용 가능</span>';
  const eff = [];
  if (def.shape) {
    const ok = hitColumns(def.shape, S.p).length > 0;
    range = `${SHAPES[def.shape].label} · ${reachText(def.shape)}`;
    state = ok ? '<span class="st good">지금 명중</span>' : `<span class="st bad">사거리 밖 · 지금 거리 ${S.p.r}</span>`;
    const blood = onBlood && ok;
    const mult = blood ? CFG.bloodMult : 1;
    eff.push(`피해 <b>${def.dmg * mult}</b>${blood ? ` <em class="bl">핏빛 ×${mult}</em>` : ''}`);
    const ol = nextOl(def, inst.id) + (blood ? CFG.bloodOl : 0);
    if (ol) eff.push(`내 과부하 <b class="v">+${ol}</b>`);
    if (def.bossOl) eff.push(`보스 과부하 <b class="g">+${def.bossOl}</b>`);
  } else if (def.leap) {
    range = `상하좌우 최대 ${def.leap}칸`;
    state = '<span class="st good">방향을 고르세요</span>';
    eff.push(`<b>${def.leap}칸</b>까지 도약 (1코스트로 여러 칸)`);
  } else if (def.shield) {
    eff.push(`실드 <b>+${def.shield}</b> · 지금 ${S.shield}/2겹`);
  } else if (def.cool) {
    eff.push(`과부하 <b class="g">−${def.cool}</b> · 지금 ${S.ol}`);
  }
  if (frozen) state = '<span class="st frz">마비 중 — 코스트만 소모</span>';
  const touch = lastPointer !== 'mouse';
  const use = touch
    ? `<button class="btn-use" type="button" id="btnUse">${def.leap && !frozen ? '칸을 눌러 도약' : '사용 · 1코'}</button>`
    : `<span class="hint">${def.leap && !frozen ? 'WASD로 방향 선택' : '클릭 또는 Space로 사용'}</span>`;
  return `<div class="d-row"><span class="d-kind k-${def.kind}"><svg><use href="#${kind.icon}"/></svg>${kind.label}</span><b class="d-name">${def.name}</b><span class="d-range">${range}</span></div>
    <div class="d-row d-flav"><span class="d-text">${def.text}</span></div>
    <div class="d-row"><span class="d-eff">${eff.join(' · ')}</span>${state}${use}</div>`;
}

function log(t, cls = '') { S.logs.push({ t, cls }); if (S.logs.length > 40) S.logs.shift(); }

let toastTimer = 0;
function toast(msg, tone = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast' + (tone ? ' ' + tone : '');
  el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 1600);
}

/* ═════════════════════════════════════════════
   9. 연출
   ═════════════════════════════════════════════ */
const FX = {
  flash(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); },
  at(r, c, cls, life = 600) {
    const d = document.createElement('div');
    d.className = 'fx-cell ' + cls;
    d.style.setProperty('--r', r); d.style.setProperty('--c', c);
    $('#fx').appendChild(d);
    setTimeout(() => d.remove(), life);
  },
  num(r, c, text, cls = '') {
    const d = document.createElement('div');
    d.className = 'fx-num ' + cls;
    d.textContent = text;
    d.style.left = `calc(${c} * (var(--cs) + var(--gap)) + var(--cs) / 2)`;
    d.style.top = `calc(${r} * (var(--cs) + var(--gap)) + var(--cs) * .32)`;
    $('#fx').appendChild(d);
    setTimeout(() => d.remove(), 1000);
  },
  shake(level) { this.flash($('#board'), 'shake-' + level, 480); },
  barrels(cols) {
    document.querySelectorAll('#bossArt .brl').forEach(g => { if (cols.includes(+g.dataset.c)) this.flash(g, 'fire', 320); });
  },
  async ambushBlast(amb) {
    let i = 0;
    for (const s of amb.segs) for (let j = 0; j < s.len; j++) {
      const r = s.horiz ? s.idx : s.start + j, c = s.horiz ? s.start + j : s.idx;
      setTimeout(() => this.at(r, c, 'fx-boom', 560), (i++) * 26);
    }
    SFX.boom(); this.shake('m');
    await wait(Math.min(460, 200 + i * 26));
  },
  async attackBlast(cells, pat) {
    const arr = [...cells];
    const cols = [...new Set(arr.map(k => RC(k)[1]))];
    this.barrels(cols);
    if (pat.nail) {
      SFX.nail();
      cols.forEach((c, i) => setTimeout(() => this.nail(c), i * 45));
      await wait(150);
    }
    arr.forEach(k => { const [r, c] = RC(k); setTimeout(() => this.at(r, c, 'fx-boom amber', 620), (r - 1) * 55); });
    SFX.heavy(); this.shake('l');
    await wait(470);
  },
  nail(c) {
    const d = document.createElement('div');
    d.className = 'fx-nail';
    d.style.left = `calc(${c} * (var(--cs) + var(--gap)) + var(--cs) / 2)`;
    d.style.top = 'calc(var(--cs) * .9)';
    d.style.height = 'calc(4 * (var(--cs) + var(--gap)))';
    $('#fx').appendChild(d);
    setTimeout(() => d.remove(), 420);
  },
  async cancel(cells) {
    [...(cells || [])].forEach(k => { const [r, c] = RC(k); this.at(r, c, 'fx-void', 520); });
    this.num(0, 2, '무력화', 'ok');
    SFX.stun();
    await wait(360);
  },
  async cardStrike(def, onBlood) {
    SFX.card();
    const cells = SHAPES[def.shape].cells.map(([dr, dc]) => [S.p.r + dr, S.p.c + dc]).filter(([r, c]) => inCol(c) && r >= 0 && r <= 4);
    cells.sort((a, b) => b[0] - a[0]);
    cells.forEach(([r, c], i) => setTimeout(() => this.at(r, c, onBlood ? 'fx-zap blood' : 'fx-zap', 420), i * 40));
    this.flash($('#player'), 'hop', 200);
    await wait(130 + cells.length * 40);
  },
  bossHit(cols, dmg, onBlood) {
    this.flash($('#bossRow'), 'hit', 340);
    const c = cols.length ? cols[Math.floor(cols.length / 2)] : 2;
    this.num(0, c, `−${dmg}`, onBlood ? 'big' : '');
    this.shake(onBlood ? 'm' : 's');
  },
  async playerHit(dmg) {
    SFX.hurt();
    this.flash($('#player'), 'hit', 440);
    this.flash($('#app'), 'hurt-vig', 560);
    this.flash($('#vitals'), 'hurt', 420);
    this.num(S.p.r, S.p.c, dmg ? `−${dmg}` : '0', 'hurt');
    await wait(340);
  },
  async block() {
    SFX.block();
    this.flash($('#player'), 'blocked', 420);
    this.num(S.p.r, S.p.c, '막음', 'block');
    await wait(280);
  },
  freeze() { SFX.zap(); this.flash($('#app'), 'volt-vig', 700); this.num(S.p.r, S.p.c, '시스템 정지', 'volt'); },
  stun() { SFX.stun(); this.flash($('#bossRow'), 'hit', 340); this.num(0, 2, '보스 과부하 정지', 'volt'); },
  fizzle() { this.flash($('#player'), 'fizz', 320); this.num(S.p.r, S.p.c, '마비', 'volt'); },
  async phaseBanner(phase) {
    const b = $('#banner');
    b.innerHTML = phase === 'night'
      ? `<div class="banner-in night"><svg><use href="#i-moon"/></svg><small>오후 12:00</small><b>광신의 시간</b><span>핏빛 타일 위 공격 카드 — 피해 ×${CFG.bloodMult} · 과부하 +${CFG.bloodOl}<br>기습 ${CFG.ambushNight}칸</span></div>`
      : `<div class="banner-in day"><svg><use href="#i-sun"/></svg><small>오전 12:00</small><b>감시망 가동</b><span>인류 정부군 우세 — 기습이 판 끝까지 뻗는다<br>기습 ${CFG.ambushDay}칸</span></div>`;
    b.hidden = false;
    try { await wait(1500); } finally { b.hidden = true; }
  },
  async bossDown() {
    for (let i = 0; i < 6; i++) setTimeout(() => { this.at(0, i % 5, 'fx-boom', 600); this.shake('l'); }, i * 120);
    SFX.heavy();
    await wait(900);
  },
  async playerDown() {
    this.flash($('#player'), 'hit', 600);
    this.shake('l');
    await wait(700);
  },
};

/* ═════════════════════════════════════════════
   10. 효과음 — 파일 없이 WebAudio로 합성
   ═════════════════════════════════════════════ */
const SFX = (() => {
  let ctx = null, out = null, noise = null;
  let muted = readJSON(SND_KEY).muted === true;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      out = ctx.createGain(); out.gain.value = muted ? 0 : 0.5; out.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.2);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }
  function tone(f, t, o = {}) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + t);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.v || 0.12, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    osc.connect(g).connect(out);
    osc.start(t0); osc.stop(t0 + t + 0.03);
  }
  function hiss(t, o = {}) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource(); src.buffer = noise;
    const bf = ctx.createBiquadFilter(); bf.type = o.type || 'lowpass'; bf.frequency.value = o.f || 1200; bf.Q.value = o.q || 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(o.v || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    src.connect(bf).connect(g).connect(out);
    src.start(t0); src.stop(t0 + t + 0.03);
  }
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; writeJSON(SND_KEY, { muted }); if (out) out.gain.value = muted ? 0 : 0.5; return muted; },
    step()   { tone(420, 0.07, { type: 'triangle', v: 0.07, f2: 560 }); },
    draw()   { hiss(0.12, { v: 0.08, f: 3000, type: 'highpass' }); tone(880, 0.08, { v: 0.05, type: 'triangle', at: 0.03 }); },
    card()   { hiss(0.16, { v: 0.1, f: 1800, type: 'bandpass', q: 1.2 }); },
    hit(big) { tone(big ? 90 : 140, big ? 0.35 : 0.18, { type: 'square', v: 0.09, f2: 50 }); hiss(big ? 0.4 : 0.2, { v: 0.16, f: big ? 900 : 1400 }); },
    boom()   { hiss(0.5, { v: 0.3, f: 700 }); tone(70, 0.45, { v: 0.26, f2: 35 }); },
    heavy()  { hiss(0.7, { v: 0.32, f: 500 }); tone(55, 0.6, { v: 0.3, f2: 28 }); },
    nail()   { for (let i = 0; i < 5; i++) { hiss(0.05, { v: 0.14, f: 5000, type: 'highpass', at: i * 0.045 }); tone(1800, 0.03, { type: 'square', v: 0.03, at: i * 0.045 }); } },
    arm()    { tone(660, 0.09, { type: 'square', v: 0.035 }); tone(990, 0.09, { type: 'square', v: 0.03, at: 0.1 }); },
    warn()   { tone(330, 0.12, { type: 'sawtooth', v: 0.045 }); tone(330, 0.12, { type: 'sawtooth', v: 0.045, at: 0.16 }); },
    ward()   { tone(660, 0.25, { v: 0.08, f2: 990 }); tone(1320, 0.2, { v: 0.04, at: 0.05 }); },
    block()  { tone(1400, 0.18, { type: 'triangle', v: 0.1, f2: 900 }); hiss(0.1, { v: 0.08, f: 4000, type: 'highpass' }); },
    cool()   { hiss(0.4, { v: 0.1, f: 2500, type: 'bandpass', q: 0.8 }); },
    zap()    { for (let i = 0; i < 4; i++) tone(200 + Math.random() * 800, 0.06, { type: 'sawtooth', v: 0.05, at: i * 0.05 }); },
    stun()   { tone(600, 0.6, { type: 'sawtooth', v: 0.06, f2: 60 }); },
    fizzle() { tone(160, 0.12, { type: 'sawtooth', v: 0.05, f2: 120 }); hiss(0.08, { v: 0.05, f: 3000, type: 'highpass' }); },
    deny()   { tone(180, 0.08, { type: 'square', v: 0.045 }); tone(140, 0.1, { type: 'square', v: 0.045, at: 0.08 }); },
    chime()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.9, { v: 0.07, at: i * 0.12 })); },
    hurt()   { tone(220, 0.25, { type: 'square', v: 0.09, f2: 90 }); },
    win()    { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.5, { type: 'triangle', v: 0.09, at: i * 0.13 })); },
    lose()   { [330, 262, 196, 131].forEach((f, i) => tone(f, 0.6, { type: 'triangle', v: 0.09, at: i * 0.18 })); },
  };
})();

/* ═════════════════════════════════════════════
   11. 입력 — 키보드 · 마우스 · 터치
   ═════════════════════════════════════════════ */
let lastPointer = window.matchMedia && window.matchMedia('(hover: hover)').matches ? 'mouse' : 'touch';
document.addEventListener('pointerdown', e => { lastPointer = e.pointerType || 'mouse'; }, true);

function selectedLeap() { return S.sel !== null && S.hand[S.sel] && CARDS[S.hand[S.sel].id].leap ? CARDS[S.hand[S.sel].id] : null; }

function onCell(r, c) {
  if (!S.started || S.over) return;
  if (selectedLeap()) {
    const t = preview().leap.get(K(r, c));
    if (t) { act({ type: 'card', i: S.sel, dir: t.dir, dist: t.dist }); return; }
  }
  const dr = r - S.p.r, dc = c - S.p.c;
  if (Math.abs(dr) + Math.abs(dc) === 1) { act({ type: 'move', dir: dirOf(dr, dc) }); return; }
  if (S.sel !== null) { S.sel = null; render(); }
}

function useSelected() {
  if (S.sel === null || !S.hand[S.sel]) return;
  if (selectedLeap() && S.freeze <= 0) { toast('도약할 방향을 고르세요 — WASD 또는 점선 칸'); return; }
  act({ type: 'card', i: S.sel });
}

function onCardClick(i) {
  if (!S.started || S.over || !S.hand[i]) return;
  const def = CARDS[S.hand[i].id];
  if (lastPointer === 'mouse') {
    // 마우스: 올려서 미리보기, 클릭하면 바로 사용 (도약은 방향 선택이 필요해 선택만)
    if (def.leap && S.freeze <= 0) { S.sel = S.sel === i ? null : i; render(); return; }
    act({ type: 'card', i });
    return;
  }
  // 터치: 한 번 눌러 미리보기, 한 번 더 누르면 사용
  if (S.sel === i) useSelected();
  else { S.sel = i; render(); }
}

const CODE_DIR = { KeyW: 'up', KeyA: 'left', KeyS: 'down', KeyD: 'right', ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right' };
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector('.sheet:not([hidden])')) { if (e.key === 'Escape') closeSheets(); return; }
  const ae = document.activeElement;
  const onControl = ae && ae !== document.body && /^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  if (!$('#result').hidden) { if (e.key === 'Enter' && !onControl) { e.preventDefault(); restart(); } return; }
  if (!S.started) { if ((e.key === 'Enter' || e.code === 'Space') && !onControl) { e.preventDefault(); startBattle(); } return; }
  // 한글 자판 상태에서도 되도록 물리 키(e.code)로 판정
  const dir = CODE_DIR[e.code];
  if (dir) {
    e.preventDefault();
    if (selectedLeap()) act({ type: 'card', i: S.sel, dir });
    else act({ type: 'move', dir });
    return;
  }
  const dm = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
  if (dm) {
    const i = +dm[1] - 1;
    if (i < S.hand.length) { if (S.sel === i) useSelected(); else { S.sel = i; S.hover = null; render(); } }
    return;
  }
  if ((e.code === 'Space' || e.key === 'Enter') && !onControl) { e.preventDefault(); useSelected(); return; }
  if (e.code === 'KeyQ') { act({ type: 'draw' }); return; }
  if (e.key === 'Escape') { if (S.sel !== null) { S.sel = null; render(); } return; }
  if (e.code === 'KeyH' || e.key === '?') { openSheet('help'); return; }
  if (e.code === 'KeyM') { toggleSound(); return; }
});

function bindInput() {
  const hand = $('#hand');
  hand.addEventListener('mousedown', e => e.preventDefault());       // 클릭으로 카드에 포커스가 남지 않게
  hand.addEventListener('click', e => { const b = e.target.closest('.card'); if (b) onCardClick(+b.dataset.i); });
  hand.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    const b = e.target.closest('.card');
    if (!b) return;
    const i = +b.dataset.i;
    if (S.hover !== i) { S.hover = i; renderBoard(); renderFoot(); }
  });
  hand.addEventListener('pointerleave', () => { if (S.hover !== null) { S.hover = null; renderBoard(); renderFoot(); } });
  const db = $('#drawBtn');
  db.addEventListener('mousedown', e => e.preventDefault());
  db.addEventListener('click', () => act({ type: 'draw' }));
  $('#detail').addEventListener('click', e => { if (e.target.closest('#btnUse')) useSelected(); });
  $('#btnStart').addEventListener('click', startBattle);
  $('#btnAgain').addEventListener('click', restart);
  $('#btnResCfg').addEventListener('click', () => openSheet('cfg'));
  $('#btnHelp').addEventListener('click', () => openSheet('help'));
  $('#btnCfg').addEventListener('click', () => openSheet('cfg'));
  $('#btnSnd').addEventListener('click', e => { e.currentTarget.blur(); toggleSound(); });
  document.querySelectorAll('.sheet').forEach(sh => sh.addEventListener('click', e => {
    if (e.target === sh || e.target.closest('[data-close]')) closeSheets();
  }));
  $('#cfgBody').addEventListener('click', onCfgClick);
  $('#cfgBody').addEventListener('change', onCfgChange);
  $('#cfgActions').addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) testAction(b.dataset.a); });
  window.addEventListener('resize', fitHand);
}

function toggleSound() { SFX.init(); const m = SFX.toggle(); renderHud(); toast(m ? '소리 끔' : '소리 켬', 'ok'); }

/* ═════════════════════════════════════════════
   12. 화면 — 시작 · 결과 · 규칙 · 테스트 설정
   ═════════════════════════════════════════════ */
function rulesHTML() {
  return `
    <li><svg><use href="#i-deck"/></svg><div><b>모든 행동은 1코스트</b>이동·카드·추가 뽑기. 한 루프에 ${CFG.costPerLoop}코스트, 턴 종료 버튼은 없다.</div></li>
    <li class="r-amb"><svg><use href="#i-cross"/></svg><div><b>2번째 코스트 = 기습 폭격</b>빨간 줄은 2번째 코스트를 쓰는 순간 터진다. 첫 행동으로 대피.</div></li>
    <li class="r-atk"><svg><use href="#i-hazard"/></svg><div><b>코스트 소진 = 턴 공격</b>기습이 터지면 주황 범위가 드러난다. 마지막 코스트 전에 벗어나기.</div></li>
    <li class="r-volt"><svg><use href="#i-bolt"/></svg><div><b>과부하 ${CFG.olMax} = ${CFG.freezeCost}코스트 마비</b>게이지는 ${CFG.olReset}으로. 보스를 과부하시키면 ${CFG.bossStunCost}코스트 동안 공격이 멈춘다.</div></li>
    <li class="r-blood"><svg><use href="#i-moon"/></svg><div><b>누적 ${CFG.phaseCost}코스트마다 낮밤 전환</b>오전 기습 ${CFG.ambushDay}칸 · 오후 기습 ${CFG.ambushNight}칸 + 핏빛 타일(피해 ×${CFG.bloodMult}, 과부하 +${CFG.bloodOl}).</div></li>`;
}

function startBattle() {
  if (S.started) return;
  SFX.init();
  $('#intro').hidden = true;
  S.started = true;
  log('인류 정부군 집행 병기 「못박이」 — 교전 개시', 'dim');
  run(() => startLoop());
}

function restart() {
  closeSheets();
  newBattle();
  handSig = ''; beamSig = '';
  S.started = true;
  log('전투 재시작', 'dim');
  render();
  run(() => startLoop());
}

function showResult(win) {
  const st = S.stats;
  const t = $('#resTitle');
  t.textContent = win ? '승리' : '패배';
  t.className = 'res-title ' + (win ? 'win' : 'lose');
  $('#resSub').textContent = win ? '집행 병기 「못박이」의 회로가 멈췄다.' : '기계 신의 몸이 버티지 못했다.';
  const rows = [
    ['버틴 루프', S.loop], ['누적 코스트', `${S.total} (나 ${S.totalP} · 보스 ${S.totalB})`],
    ['준 피해', st.dealt], ['받은 피해', st.taken],
    ['회피', st.dodged], ['핏빛 강타', st.bloodHits],
    ['내 과부하 정지', st.freezes], ['보스 과부하 정지', st.stuns],
  ];
  $('#resStats').innerHTML = rows.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  $('#result').hidden = false;
}

function helpHTML() {
  const slot = (url, name) => url ? `<b class="ok">적용됨</b> <code>${url}</code>` : `<span class="dim">기본 그림 사용 중 — <code>assets/${name}.png</code>를 넣으면 교체</span>`;
  const cardRows = Object.values(CARDS).map(d => {
    const range = d.shape ? `${SHAPES[d.shape].label}<br><span class="dim">${reachText(d.shape)}</span>` : d.leap ? `최대 ${d.leap}칸` : '자신';
    const eff = [d.dmg ? `피해 ${d.dmg}` : '', d.shield ? `실드 +${d.shield}` : '', d.cool ? `과부하 −${d.cool}` : '', d.ol ? `내 과부하 +${d.ol}` : '', d.bossOl ? `보스 과부하 +${d.bossOl}` : '', d.rapid ? `연사 시 +${d.rapid}씩 가중` : '', d.persist ? '상주' : ''].filter(Boolean).join(' · ');
    return `<tr><td>${d.name}</td><td>${KINDS[d.kind].label} · ${d.n}장</td><td>${range}</td><td>${eff}</td></tr>`;
  }).join('');
  const patRows = PATTERNS.map(p => `<tr><td>${p.name}</td><td>${p.desc}</td><td>피해 ${p.dmg}${p.nail ? ` · 과부하 +${CFG.nailOl}` : ''}</td></tr>`).join('');
  return `
  <section><h4>한 루프의 흐름</h4>
    <ol>
      <li>루프 시작 — 코스트 ${CFG.costPerLoop} 충전, 손패 ${CFG.handRefill}장까지 보충, <b>빨간 기습 줄</b>과 턴 공격 패턴 예고</li>
      <li>첫 행동 — 빨간 줄 밖으로 대피</li>
      <li><b>2번째 코스트를 지불하는 순간</b> 기습 폭발 (그 행동은 폭발 뒤에 처리) → <b>주황 턴 공격 범위</b> 공개</li>
      <li>남은 행동 — 주황 범위 밖으로 자리 잡기</li>
      <li>${CFG.atkTiming === 'pay' ? '<b>마지막 코스트를 지불하는 순간</b>' : '<b>마지막 행동이 끝난 뒤</b>'} 턴 공격 → 다음 루프</li>
    </ol>
  </section>
  <section><h4>과부하</h4>
    <p>특정 카드를 연사하거나 장력 가속 못총에 맞으면 과부하가 찬다. ${CFG.olMax}이 되면 ${CFG.olReset}으로 줄고 <b>${CFG.freezeCost}코스트 동안 마비</b> — 무엇을 눌러도 코스트만 빠지고 제자리다. 그 사이 기습과 턴 공격은 그대로 들어온다.</p>
    <p>보스도 과부하 ${CFG.olMax}이 되면 <b>${CFG.bossStunCost}코스트 동안 기습·턴 공격이 멈춘다</b>. 코스트 칸의 표식에 초록 사선이 그어지면 무력화 예정.</p>
  </section>
  <section><h4>낮과 밤</h4>
    <p>나와 보스가 쓴 코스트가 합쳐 ${CFG.phaseCost}이 될 때마다 시계가 한 바퀴 돌며 전환된다. 보스 기습 1회 = ${CFG.bossAmbushCost}코, 턴 공격 1회 = ${CFG.bossAttackCost}코로 센다.</p>
    <p><b>오전(낮)</b> 인류 정부군 우세 — 감시망으로 기습 줄이 판 끝까지 뻗어 ${CFG.ambushDay}칸.<br><b>오후(밤)</b> 광신의 시간 — 기습 ${CFG.ambushNight}칸, 핏빛 타일 ${CFG.bloodTiles}칸이 매 루프 깔린다. 그 위에서 공격 카드를 쓰면 피해 ×${CFG.bloodMult}, 과부하 +${CFG.bloodOl}.</p>
  </section>
  <section><h4>카드 (테스트용)</h4>
    <p>모든 카드는 1코스트. 사거리가 보스 줄(맨 위)에 닿아야 쓸 수 있다. 칸 왼쪽 위 숫자가 보스와의 거리.</p>
    <div class="tbl-wrap"><table class="ctbl"><thead><tr><th>이름</th><th>종류</th><th>사거리</th><th>효과</th></tr></thead><tbody>${cardRows}</tbody></table></div>
  </section>
  <section><h4>보스 턴 공격 패턴</h4>
    <div class="tbl-wrap"><table class="ctbl"><thead><tr><th>패턴</th><th>범위</th><th>효과</th></tr></thead><tbody>${patRows}</tbody></table></div>
  </section>
  <section><h4>조작</h4>
    <p><b>이동</b> WASD·방향키, 또는 옆 칸 터치 · <b>카드</b> 1–6으로 선택 후 한 번 더(또는 Space), 마우스는 클릭 즉시 사용, 터치는 두 번 · <b>뽑기</b> Q · <b>취소</b> Esc · <b>소리</b> M</p>
  </section>
  <section><h4>이미지 슬롯</h4>
    <p>주인공 SD — ${slot(ASSET.hero, 'hero')}<br>카드 배경 — ${slot(ASSET.cardBg, 'card-bg')}<br>보스(선택) — ${slot(ASSET.boss, 'boss')}</p>
    <p class="dim">png · webp · jpg 모두 인식한다.</p>
  </section>`;
}

const TEST_ACTIONS = [
  ['flip', '낮밤 즉시 전환'], ['ol', '내 과부하 +50'], ['bol', '보스 과부하 +50'],
  ['bhp', '보스 HP −50'], ['heal', 'HP 전부 회복'], ['restart', '전투 재시작'], ['reset', '설정 기본값', 'danger'],
];
function buildCfgSheet() {
  $('#cfgActions').innerHTML = TEST_ACTIONS.map(([a, l, c]) => `<button type="button" data-a="${a}" class="${c || ''}">${l}</button>`).join('');
  $('#cfgBody').innerHTML = CFG_UI.map(it => {
    if (it.group) return `<h4 class="cfg-g">${it.group}</h4>`;
    const id = 'cfg-' + it.k;
    const tag = it.restart ? '<em>재시작</em>' : '';
    if (it.type === 'toggle') return `<label class="cfg-row sw-row" for="${id}"><span>${it.label}${tag}</span><input type="checkbox" id="${id}" data-k="${it.k}"${CFG[it.k] ? ' checked' : ''}><i class="sw" aria-hidden="true"></i></label>`;
    if (it.type === 'seg') return `<div class="cfg-row"><span>${it.label}${tag}</span><div class="seg">${it.opts.map(([v, l]) => `<button type="button" id="${id}-${v}" data-k="${it.k}" data-v="${v}" class="${CFG[it.k] === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
    return `<div class="cfg-row"><span>${it.label}${tag}</span><div class="step"><button type="button" data-k="${it.k}" data-d="-1" aria-label="${it.label} 줄이기">−</button><output id="${id}">${CFG[it.k]}${it.unit}</output><button type="button" data-k="${it.k}" data-d="1" aria-label="${it.label} 늘리기">+</button></div></div>`;
  }).join('');
}
function onCfgClick(e) {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const k = b.dataset.k;
  const it = CFG_UI.find(x => x.k === k);
  if (b.dataset.v !== undefined) setCfg(k, b.dataset.v);
  else setCfg(k, CFG[k] + (+b.dataset.d) * (it.step || 1));
}
function onCfgChange(e) { const t = e.target; if (t.matches('input[type="checkbox"][data-k]')) setCfg(t.dataset.k, t.checked); }
function setCfg(k, v) {
  if (LIMITS[k]) v = clamp(v, LIMITS[k][0], LIMITS[k][1]);
  CFG[k] = v;
  saveCfg();
  if (k === 'phaseCost') buildClock();
  handSig = '';
  buildCfgSheet();
  render();
}
function testAction(a) {
  if (a === 'restart') { restart(); return; }
  if (a === 'reset') {
    Object.assign(CFG, DEFAULTS); saveCfg();
    buildClock(); buildCfgSheet(); handSig = ''; render();
    toast('설정을 기본값으로 되돌렸어요 · HP는 재시작 때 적용', 'ok');
    return;
  }
  if (!S.started || S.over) { toast('전투 중에만 쓸 수 있어요'); return; }
  if (S.busy) { toast('행동 처리 중이에요 — 잠시 뒤 다시'); return; }
  if (a === 'flip') { closeSheets(); run(async () => { S.lastSwitch = S.total; await switchPhase(); }); return; }
  if (a === 'ol') addOverload(50, '테스트');
  if (a === 'bol') addBossOl(50);
  if (a === 'heal') S.hp = S.maxHp;
  if (a === 'bhp') {
    S.boss.hp = Math.max(0, S.boss.hp - 50);
    if (S.boss.hp <= 0) { closeSheets(); run(() => victory()); return; }
  }
  handSig = ''; render();
  toast('적용했어요', 'ok');
}
function openSheet(which) {
  closeSheets();
  if (which === 'help') { $('#helpBody').innerHTML = helpHTML(); $('#sheetHelp').hidden = false; }
  else { buildCfgSheet(); $('#sheetCfg').hidden = false; }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function closeSheets() {
  document.querySelectorAll('.sheet').forEach(s => { s.hidden = true; });
  if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
}

/* ═════════════════════════════════════════════
   13. 시작
   ═════════════════════════════════════════════ */
buildBoard();
buildClock();
bindInput();
newBattle();
if (location.hash === '#debug') window.I12 = { S, CFG, CARDS, render, act, restart };   // 개발용: 상태 확인·조작
$('#introRules').innerHTML = rulesHTML();
render();
loadAssets();
})();
</script>
</body>
</html>
